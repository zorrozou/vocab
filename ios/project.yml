name: VocabApp
options:
  bundleIdPrefix: com.zorro
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  VocabApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VocabApp
    info:
      path: VocabApp/Info.plist
      properties:
        CFBundleDisplayName: 词航
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: 跟读评分需要用麦克风采集你的朗读
        NSSpeechRecognitionUsageDescription: 跟读需要使用本机语音识别；本机识别不可用时不会自动切换网络识别
        VocabAPIBaseURL: "$(VOCAB_API_BASE_URL)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zorro.vocab
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "X5ANMACUCD"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Debug:
          INFOPLIST_FILE: VocabApp/Info-Debug.plist
  VocabUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VocabUITests
    dependencies:
      - target: VocabApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zorro.vocab.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        TEST_TARGET_NAME: VocabApp
schemes:
  VocabUIRegression:
    build:
      targets:
        VocabApp: all
        VocabUITests: [test]
    test:
      targets:
        - VocabUITests
