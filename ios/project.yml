name: VocabApp
options:
  bundleIdPrefix: com.zorro
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  VocabApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VocabApp
    info:
      path: VocabApp/Info.plist
      properties:
        CFBundleDisplayName: 词航
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: 跟读评分需要用麦克风采集你的朗读
        NSSpeechRecognitionUsageDescription: 跟读评分需要识别你的朗读内容（支持本机识别的设备上不会上传）
        NSAppTransportSecurity:
          NSExceptionDomains:
            175.27.210.206:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zorro.vocab
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_USER_SCRIPT_SANDBOXING: NO
