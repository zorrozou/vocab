/* 词库等级名（词库按 level+frq 排序；区间重建后同步更新） */

  const byDay = new Map(result.map((entry, index) => [entry.d, index]));
  for (const card of Object.values(cards)) {
    if (typeof card?.due !== "string" || !card.due) continue;
    const instant = new Date(card.due);
    if (!Number.isFinite(instant.getTime())) continue;
    if (/^\d{4}-\d{2}-\d{2}$/.test(card.due) && instant.toISOString().slice(0, 10) !== card.due) continue;
    const pad = n => String(n).padStart(2, "0");
    const localDay = `${instant.getFullYear()}-${pad(instant.getMonth() + 1)}-${pad(instant.getDate())}`;

}
function retentionSummary(cards, log, now = Date.now()) {

    const day = value.slice(0, 10), midnight = new Date(day + "T00:00:00Z");
    if (!Number.isFinite(midnight.getTime()) || midnight.toISOString().slice(0, 10) !== day) return null;
    const time = new Date(value).getTime();
    return Number.isFinite(time) ? time : null;
  };
  for (const event of log) {
    if (!event || !["learn", "review"].includes(event.kind) || typeof event.word !== "string" ||
        typeof event.d !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(event.d)) continue;
    const time = parseDate(event.d + "T08:00:00Z");
    if (time !== null && (!latest.has(event.word) || time > latest.get(event.word))) latest.set(event.word, time);
  }
  for (const [word, card] of Object.entries(cards)) {
    const f = card?.fsrs, stability = f?.stability;
    if (!Number.isFinite(stability) || stability <= 0 ||
        (card.pendingFsrs && (!Array.isArray(card.pendingFsrs.events) || card.pendingFsrs.events.length))) { unknown++; continue; }
    const recorded = f.lastReview ?? f.last_review;
    const fallback = recorded == null;
    const time = fallback ? latest.get(word) : parseDate(recorded);
    if (time == null || time > now || !Number.isFinite(now)) { unknown++; continue; }
    if (fallback || (typeof recorded === "string" && recorded.length === 10)) approximate++;
    const elapsed = (now - time) / 86400000;
    const r = Math.pow(1 + 0.9805 * elapsed / Math.max(0.2, stability), -0.1542);

}
const INTERVAL = { 1: 1, 2: 6, 3: 8, 4: 15, 5: 45 };

// HTML 文本及双引号属性使用同一编码；保持 data-* 读取到的原文不变。
function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"})[c]);
}

/* ---------------- 状态 ---------------- */
function defaultState() {
  return { v: 1, calibrated: false, frontier: 0, pointer: 1, probeCount: 0,
           posterior: null, pendingNew: [], track: null,
           cards: {}, log: [], personalized: {}, streak: 0, lastDay: null,
           settings: { newPerDay: 10, dailyCap: 100 } };
}
// 原始损坏内容留在原槽位，启动时不能用空状态覆盖它。
const corruptStartup = [];
function readStartupJSON(key) {
  const raw = localStorage.getItem(key);
  if (!raw) return null;
  try { return JSON.parse(raw); }
  catch (_) { corruptStartup.push({key, raw}); return null; }
}
let S = Object.assign(defaultState(), readStartupJSON("vocab_v1") || {});
let localSaveFailed = false;
let largeActive = null;
let normalActive = null;
// 新账号按不可复用的服务器标识分槽；旧会话保留旧槽以便离线读取与恢复。
function accountSlot(auth) {
  if (!auth) return "vocab_v1_guest";
  if (auth.accountId) {
    if (!/^[a-f0-9]{32}$/.test(auth.accountId)) throw new Error("账号标识无效");
    return `vocab_v3_a${auth.accountId}`;

  return `vocab_v2_u${auth.userId}_${encodeURIComponent(String(auth.username || "").toLowerCase())}`;
}
function slotClock(slot, name) { return `${slot}:${name}`; }

function restoreSlotClocks(slot) {
  localStorage.setItem("vocab_write_ts", localStorage.getItem(slotClock(slot, "write")) || "0");
  localStorage.setItem("vocab_last_sync_ts", localStorage.getItem(slotClock(slot, "sync")) || "0");
}
function preserveMainBeforeSwitch(nextSlot) {
  const raw = localStorage.getItem("vocab_v1"), oldSlot = localStorage.getItem("vocab_v1_owner");
  if (!raw || oldSlot === nextSlot || (oldSlot && localStorage.getItem(oldSlot) === raw)) return;
  let key;
  do {
    const bytes = crypto.getRandomValues(new Uint8Array(16));
    key = "vocab_unverified_" + Array.from(bytes, b => b.toString(16).padStart(2, "0")).join("");
  } while (localStorage.getItem(key));
  localStorage.setItem(key, raw); // 必须先保留，失败时调用者不能覆盖主槽位。
}
const observedSlotValues = new Map();
function writeSlotAndMain(slot, state) {
  preserveMainBeforeSwitch(slot);
  const raw = JSON.stringify(state);
  localStorage.setItem(slot, raw);
  observedSlotValues.set(slot, raw);
  localStorage.setItem("vocab_v1", raw);
  localStorage.setItem("vocab_v1_owner", slot);
}
function markSlotSynced(slot) {
  const stamp = localStorage.getItem("vocab_write_ts") || "0";
  localStorage.setItem("vocab_last_sync_ts", stamp);
  localStorage.setItem(slotClock(slot, "sync"), stamp);
  localStorage.removeItem(slotClock(slot, "dirty"));
}
function loadSlotClocks(slot) { restoreSlotClocks(slot); }
function personalSentence(word) {
  const value = S.personalized?.[word];
  if (S.cards?.[word] && isMastered(S.cards[word])) return null;
  return value && !(S.rejectedPersonalized?.[word] || []).includes(value.text) ? value : null;
}
function versionDevice() {
  let device = localStorage.getItem("vocab_settings_device");
  if (!device || !/^[a-z0-9-]{1,64}$/.test(device)) {
    device = crypto.randomUUID ? crypto.randomUUID().toLowerCase() : Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, "0")).join("");
    localStorage.setItem("vocab_settings_device", device);
  }

}
function markPlacementReset() {
  try {
    const counter = S.placementVersion?.counter || 0;
    if (!Number.isSafeInteger(counter) || counter < 0 || counter >= Number.MAX_SAFE_INTEGER) throw new Error("定级版本无效");
    const device = versionDevice();
    const id = crypto.randomUUID ? crypto.randomUUID().toLowerCase() : Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, "0")).join("");
    S.placementVersion = {counter:counter + 1, device, id};

}
function comparePersonalVersion(a, b) {
  if (!a) return b ? -1 : 0;

}
function reservePersonalVersions(state, words, deleted = false) {
  const device = versionDevice(), result = {};
  for (const word of new Set(words)) {
    let counter = state.personalVersions?.[word]?.counter || 0;
    for (const job of state.personalJobs || []) counter = Math.max(counter, job.personalVersions?.[word]?.counter || 0);
    if (!Number.isSafeInteger(counter) || counter < 0 || counter >= Number.MAX_SAFE_INTEGER) throw new Error("例句版本无效");

function applyPersonalJobResult(state, job, row) {
  const word = row.target, version = job.personalVersions?.[word], current = state.personalVersions?.[word];

  if (version && (comparePersonalVersion(version, current) < 0 ||
      reservations.some(other => comparePersonalVersion(version, other) < 0) ||
      (comparePersonalVersion(version, current) === 0 && current?.deleted))) return false;

  const equivalent = (a, b) => a?.text === b?.text && (a?.recall || "") === (b?.recall || "") && (a?.zh || "") === (b?.zh || "");

/* ---------------- 语音（神经网络 TTS，浏览器兜底） ---------------- */
let audio = null;

async function playText(text) {

    const ctx = audioCtx();
    if (ctx.state === "suspended") await ctx.resume();
    // 逐条容错：任何一条音频拉取失败只跳过该条（Promise.all 一处失败会作废整链——

    const ok = items.map((t, i) => ({ t, buf: bufs[i] })).filter(x => x.buf);
    if (!ok.length) { apHint(); return; }

/* ---------------- 调度（FSRS-6 · 服务端官方 py-fsrs 计算，阶梯回退） ---------------- */
const tomorrow = () => addDays(today(), 1);

      method: "POST", headers: { "Content-Type": "application/json", ...authHeaders() }, body: JSON.stringify(body)
    });

        if (!active()) return null;

        renderUserTag();

    if (!r || !Number.isFinite(r.stability) || !Number.isFinite(r.difficulty) || !r.due) return null;
    r.lastReview = r.last_review ?? r.lastReview ?? null;

  const mult = rating === 2 ? 0.6 : rating === 4 ? 1.5 : 1;

async function replayPendingFsrs(c) {

  if (!c.pendingFsrs || !c.pendingFsrs.events.length) return true;
  const pending = structuredClone(c.pendingFsrs), state = S, owner = AUTH;

    if (!active()) return false;

    if (!active()) return false;
    if (!result || (schedulerKey && result.scheduler_key !== schedulerKey)) return false;
    if (result.scheduler_key || schedulerKey) versions.set(event.id, result.scheduler_key || schedulerKey);
    if (result.scheduler_key && result.scheduler_config) configs.set(result.scheduler_key, result.scheduler_config);

async function scheduleFsrs(c, body, rating) {
  const state = S, owner = AUTH;
  if (!c.pendingFsrs) c.pendingFsrs = { base: { is_new: false, state: 1, stability: 0, difficulty: 0, ...body }, events: [] };
  // 历史保存重算所需的完整事件，不只保存已应用的 ID。
  if (!c.fsrsHistory) { c.fsrsHistory = structuredClone(c.pendingFsrs); c.fsrsReplayVersions = {}; }

  const eventTime = Math.max(Date.now(), lastEvent ? Date.parse(lastEvent.at) + 1 : 0);
  const event = { id: crypto.randomUUID ? crypto.randomUUID() :
    Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, "0")).join(""),
    rating, at: new Date(eventTime).toISOString() };
  c.pendingFsrs.events.push(event);
  c.fsrsHistory.events.push(event);
  await save(); // 请求之前持久化，应用中断后仍可重试。
  if (localSaveFailed || S !== state || AUTH !== owner) return;
  if (!(await replayPendingFsrs(c)) && S === state && AUTH === owner && c.pendingFsrs?.events.some(e => e.id === event.id)) ladderFallback(c, rating);
}

async function flushPendingFsrs() {

  for (const c of Object.values(S.cards)) {

    const replayed = await replayPendingFsrs(c);
    if (S !== originalState || AUTH !== originalAuth) return;
    if (!replayed) break;
    changed = true;
  }
  if (!Object.values(S.cards).some(c => c.pendingFsrs)) fsrsReplayWarning = "";

}
const converged = () => (postStd() < 500 && S.probeCount >= 12) || S.probeCount >= 40;

/* ---------------- v1.3 置信度扩散：水平会漂移，系统保持"可被说服" ---------------- */
/* 每天一次，后验与 σ=100 的高斯核卷积（借鉴 Glicko 的 RD 增长）：均值不变、std 缓慢回升，
   防止收敛后的后验"自信到动不了"，让探测证据始终能产生影响 */
function diffusePosterior() {
  if (!S.posterior) return;
  if (postStd() >= 400) return;   // 不确定度封顶：够模糊就不再扩散
  if (Object.values(S.posteriorHistory?.events || {}).some(e => e.kind === "diffuse" && e.day === today())) return;
  recordPosterior("diffuse");
  const k = Math.exp(-(250 * 250) / (2 * 100 * 100));   // 网格步长 250 的邻位权重 ≈0.0439
  const p = S.posterior, n = p.length, out = new Array(n);
  for (let i = 0; i < n; i++) out[i] = p[i] + k * ((i > 0 ? p[i-1] : 0) + (i < n - 1 ? p[i+1] : 0));
  const sum = out.reduce((a, b) => a + b, 0);
  S.posterior = out.map(v => v / sum);
}

/* ---------------- v1.2/v1.3 自适应水平追踪：每日一次评估与重规划 ---------------- */
function trackLevelDaily() {
  if (!S.calibrated || !S.posterior) return;
  if (S.track && S.track.evalDay === today()) return;   // 每日最多一次
  const track = S.track || {};
  // v1.3：先做置信度扩散（每日一次），再评估
  if (track.diffuseDay !== today()) { diffusePosterior(); track.diffuseDay = today(); }
  const T = Math.round(postMean()), std = postStd();
  if (T - S.pointer > 500 && std < 800) {
    track.lastNote = `连续表现超过当前级别，发词位置从 ${S.pointer} 追平到 ≈${T}（${LVL_NAME[lvlOfPos(T)]}），中间词视为已会跳过`;
    S.pointer = T;
    track.lowSince = null; track.throttle = false;
  } else if (S.pointer - T > 500) {
    if (!track.lowSince) track.lowSince = today();
    if (track.lowSince <= addDays(today(), -1) && !track.throttle) {
      track.throttle = true;
      track.lastNote = `近期新词偏难（水平估值 ≈${T}，游标 ${S.pointer}），新词临时降到 5 个/天，先消化存量`;
    }
  } else {
    if (track.throttle) track.lastNote = `水平追上来了（≈${T}），新词恢复 ${S.settings.newPerDay} 个/天`;
    track.lowSince = null; track.throttle = false;
  }
  // v1.3 级别滞回：后验均值跨边界须连续 3 天，才正式调整展示级别（防单日抖动）
  const band = lvlOfPos(Math.max(1, T));
  if (!track.shownLevel) track.shownLevel = lvlOfPos(Math.max(1, S.pointer));
  if (band !== track.shownLevel) {
    if (track.pendingBand === band) track.pendingDays = (track.pendingDays || 0) + 1;
    else { track.pendingBand = band; track.pendingDays = 1; }
    if (track.pendingDays >= 3) {
      track.shownLevel = band;
      track.lastNote = `词汇水平连续 3 天稳定在「${LVL_NAME[band]}」区间，当前级别已调整`;
      track.pendingBand = null; track.pendingDays = 0;
    }
  } else { track.pendingBand = null; track.pendingDays = 0; }
  track.evalDay = today();
  S.track = track;
  save();
}

/* v1.3 主动探测选词：上方近端 / 上方远端 / 下方回归检查 各 1 个 */
async function pickProbes(reviewsAll, news, active = () => true) {
  if (!S.calibrated || !S.posterior) return [];
  // 每日总计 3 题：当天重建队列（继续复习/二次进入）不重复追加探测
  const already = S.log.filter(l => l.kind === "probe" && l.d === today()).length;
  const need = 3 - already;
  if (need <= 0) return [];
  const m = postMean(), sd = Math.max(60, postStd());
  const recentProbe = new Set(S.log.filter(l => l.kind === "probe" && l.d >= addDays(today(), -14)).map(l => l.word));
  const busy = new Set([...reviewsAll, ...news.map(w => w.word)]);
  const zones = [
    [m + 0.5 * sd, m + 1.0 * sd, true],   // 上方近端：反向回想，检验是否真会而非眼熟
    [m + 1.5 * sd, m + 2.0 * sd, false],  // 上方远端：正向再认，探大幅进步
    [m - 1.0 * sd, m - 0.5 * sd, false],  // 下方：正向再认，高估回归检查
  ];
  const out = [];
  for (const [lo, hi, reverse] of zones) {
    if (out.length >= need) break;
    const a = Math.max(1, Math.round(lo)), b = Math.min(10991, Math.round(hi));
    if (a > b) continue;
    for (let tries = 0; tries < 6; tries++) {
      const pos = a + Math.floor(Math.random() * (b - a + 1));
      try {
        const r = await fetch(`${API}/api/v1/lexicon/at?pos=${pos}&n=1`).then(r => r.json());
        if (!active()) return [];
        const w = r.words && r.words[0];
        if (w && !S.cards[w.word] && !recentProbe.has(w.word) && !busy.has(w.word)
            && !out.find(x => x.word === w.word) && !S.pendingNew.find(x => x.word === w.word)) {
          out.push({ ...w, reverse }); break;
        }
      } catch (e) { if (!active()) return []; }
    }
  }
  return out;
}

/* ---------------- 队列 ---------------- */
async function buildQueue(stillOnPage = () => true) {
  const state = S, owner = AUTH, currentSession = session;
  const active = () => S === state && AUTH === owner && session === currentSession && stillOnPage();
  await flushPendingFsrs();
  if (!active()) return false;
  await refreshPersonalJobs();
  if (!active()) return false;
  const completed = new Set(S.log.filter(l => l.d === today() && ["learn", "review", "probe"].includes(l.kind)).map(l => l.word));
  const remaining = Math.max(0, S.settings.dailyCap - completed.size);
  const due = Object.entries(S.cards)
    .filter(([w, c]) => !completed.has(w) && c.due && new Date(c.due) <= new Date())
    .sort((a, b) => a[1].due < b[1].due ? -1 : 1)
    .map(([w]) => w);
  const reviews = due.slice(0, remaining);
  // 提前巩固位：刚学会（≤7天）、FSRS 未到期、未掌握的词，按 P=(1−R)×0.5 概率抽取（≤5个）
  const nowD = new Date();
  const earlyPool = Object.entries(S.cards).filter(([w, c]) => {
    if (completed.has(w) || isMastered(c) || new Date(c.due) <= nowD) return false;
    const last = [...S.log].reverse().find(l => l.word === w);
    if (!last) return false;
    const elapsed = (nowD - new Date(last.d + "T12:00:00")) / 86400000;
    if (elapsed > 7 || elapsed < 1) return false;   // 昨天刚过的才进入概率池
    const S0 = c.fsrs ? Math.max(0.2, c.fsrs.stability) : 2;
    const R = Math.pow(1 + 0.9805 * elapsed / S0, -0.1542);
    return Math.random() < (1 - R) * 0.5;
  }).map(([w]) => w);
  const early = earlyPool.filter(w => !reviews.includes(w))
    .slice(0, Math.min(5, Math.max(0, remaining - reviews.length)));
  const reviewsAll = [...reviews, ...early];
  trackLevelDaily();   // v1.2：水平追踪每日一次（可能跳位/减压）
  const learnedToday = new Set(S.log.filter(l => l.kind === "learn" && l.d === today()).map(l => l.word)).size;
  const newBudget = Math.max(0, (S.track && S.track.throttle ? 5 : S.settings.newPerDay) - learnedToday);
  const nNew = Math.min(newBudget, Math.max(0, remaining - reviewsAll.length));
  const news = [];
  // 只清理已入卡项；选中但未学完的词继续保留，退出重进不会丢词。
  S.pendingNew = S.pendingNew.filter(w => !S.cards[w.word]);
  for (const w of S.pendingNew) {
    if (news.length >= nNew) break;
    if (!completed.has(w.word) && !news.find(x => x.word === w.word)) news.push({ ...w, fromPending: true });
  }
  let cursor = S.pointer, exhausted = false, scanBatch = Math.min(30, nNew + 2);
  while (news.length < nNew && !exhausted) {
    const want = Math.min(30, Math.max(scanBatch, nNew - news.length + 2));
    const resp = await fetch(`${API}/api/v1/lexicon/at?pos=${cursor}&n=${want}`);
    if (!active()) return false;
    if (!resp.ok) throw new Error("词条加载失败");
    const r = await resp.json();
    if (!active()) return false;
    if (!Array.isArray(r.words)) throw new Error("词条响应无效");
    for (const w of r.words) {
      if (news.length >= nNew) break;
      if (!completed.has(w.word) && !S.cards[w.word] && !news.find(x => x.word === w.word)) news.push(w);
    }
    if (r.exhausted === true) { exhausted = true; break; }
    // Older servers have no scan cursor. Advance from their last returned
    // position; an empty response cannot safely prove the vocabulary ended.
    const next = r.next_pos ?? (r.words.length ? Math.max(...r.words.map(w => w.pos)) + 1 : null);
    if (!Number.isSafeInteger(next) || next <= cursor) throw new Error("词条分页无效");
    cursor = next;
    scanBatch = Math.min(30, scanBatch * 2);
  }
  // 统一按词形补全详情，避免位置漂移造成空释义或错词释义。
  for (const w of news) {
    if (!hasMeaning(w)) {
      try {
        const resp = await fetch(`${API}/api/v1/lexicon/word?word=${encodeURIComponent(w.word)}`);
        if (!active()) return false;
        if (!resp.ok) continue;
        const full = await resp.json(), pending = w.fromPending;
        if (!active()) return false;
        if (!full || typeof full.word !== "string" || full.word.toLowerCase() !== w.word.toLowerCase()) continue;
        Object.assign(w, full);
        w.fromPending = pending;
      } catch (e) { if (!active()) return false; }
    }
  }
  // v1.3 每日主动探测：3 个探测词（2 个后验上方区 / 1 个下方区）随机混入复习段，
  // 4选1 形式与复习测验无差别——用户无感知，证据全额（与定级同级 weight 1.0）
  const probeBudget = Math.max(0, remaining - reviewsAll.length - news.length);
  const probes = probeBudget ? (await pickProbes(reviewsAll, news, active)).slice(0, probeBudget) : [];
  if (!active()) return false;
  const revBlock = reviewsAll.map(w => ({ kind: "review", word: w }));
  for (const w of probes) {
    const at = Math.floor(Math.random() * (revBlock.length + 1));
    revBlock.splice(at, 0, { kind: "probe", word: w.word, detail: w });
  }
  session.queue = [
    ...revBlock,
    ...news.map(w => ({ kind: "learn", word: w.word, detail: w }))
  ];
  session.idx = 0;
  save();
  prefetchDay(news, reviewsAll);
  return true;
}

/* 队列确定后立即后台预生成：例句三句套装 + TTS 音频预热，不等翻卡 */
function prefetchDay(news, reviewWords) {
  const weak = [...new Set(S.log.filter(l => l.rating <= 2 && l.d >= addDays(today(), -7)).map(l => l.word))].slice(0, 15).join(",");
  const jobs = news.map(w =>
    fetch(`${API}/api/v1/sentence/trio?word=${encodeURIComponent(w.word)}&weak=${encodeURIComponent(weak)}&cap=${S.pointer + 10}`)
      .then(r => r.json())
      .then(r => { if (r.sentences && r.sentences.length) w.sentences = r.sentences; })
      .catch(() => {})
  );
  Promise.all(jobs).then(() => {
    const texts = [];
    news.forEach(w => { texts.push(w.word); (w.sentences || []).forEach(s => texts.push(s.text)); });
    reviewWords.slice(0, 15).forEach(w => texts.push(w));
    texts.slice(0, 80).forEach(t => fetch(`${API}/api/v1/tts?text=${encodeURIComponent(t)}&v=${encodeURIComponent(S.settings.voice || "")}`).catch(() => {}));
  });
}

// 主页显示和建队列共用每日去重、复习优先与容量规则。
function dailyPlanSummary(state, day = today(), now = new Date()) {
  const completed = new Set(state.log.filter(x => x.d === day && ["learn", "review", "probe"].includes(x.kind)).map(x => x.word));
  const remaining = Math.max(0, state.settings.dailyCap - completed.size);
  const dueAvailable = Object.entries(state.cards).filter(([word, card]) => !completed.has(word) && card.due && new Date(card.due) <= now).length;
  const duePlanned = Math.min(dueAvailable, remaining);
  const learned = new Set(state.log.filter(x => x.d === day && x.kind === "learn").map(x => x.word)).size;
  const target = state.track?.throttle ? 5 : state.settings.newPerDay;
  const newPlanned = Math.min(Math.max(0, target - learned), Math.max(0, remaining - duePlanned));
  return {completed:completed.size, dueAvailable, duePlanned, newPlanned, totalPlanned:completed.size + duePlanned + newPlanned};
}

/* ---- 定级流程（30 题） ----
   前 12 题覆盖六个区间，后 18 题围绕当前估计探测；答完后根据累计证据计算边界。 */
const PLACEMENT_BANDS = [
  { lo: 1, hi: 2000 }, { lo: 2001, hi: 4000 }, { lo: 4001, hi: 6000 },
  { lo: 6001, hi: 8000 }, { lo: 8001, hi: 10000 }, { lo: 10001, hi: 10987 }
];
let placePositions = [];
let placeAnswers = [];

function makePlacementPositions() {
  const out = [];
  for (const [i, b] of PLACEMENT_BANDS.entries()) {
    const used = new Set(Object.values(S.bandEvidence?.[i]?.events || {}).map(e => e.pos));
    const all = Array.from({length: b.hi - b.lo + 1}, (_, n) => b.lo + n);
    let candidates = all.filter(p => !used.has(p));
    if (candidates.length < 2) candidates = all;
    for (let n = 0; n < 2; n++) out.push(candidates.splice(Math.floor(Math.random() * candidates.length), 1)[0]);
  }
  return out;
}

function catFinalMean() {
  const a = catMeans.slice(-5).sort((x, y) => x - y);
  return a.length ? Math.round(a[Math.floor(a.length / 2)]) : Math.max(1, Math.round(postMean()));
}
let catMeans = [];

function placementEstimate() {
  let estimate = PLACEMENT_BANDS[0].lo;
  for (let i = 0; i < PLACEMENT_BANDS.length; i++) {
    const b = PLACEMENT_BANDS[i];
    const score = placeAnswers.slice(i * 5, i * 5 + 5).filter(Boolean).length;
    if (score < 3) break;   // 低于60%：该区间不扎实，停在最后通过区间的估值
    estimate = Math.min(b.hi, b.lo + Math.round((b.hi - b.lo) * (score - 1) / 5));
  }
  return estimate;
}

function posteriorAround(mean, sd = 500) {
  const raw = GRID.map(g => Math.exp(-((g - mean) ** 2) / (2 * sd * sd)));
  const sum = raw.reduce((a, b) => a + b, 0);
  return raw.map(v => v / sum);
}

function placementScoreText() {
  return PLACEMENT_BANDS.map((b, i) => {
    const st = S.bandStats?.[i] || {a: 0, b: 0};
    const format = n => Number.isInteger(n) ? String(n) : n.toFixed(1);
    return `${b.lo}~${b.hi}：${format(st.a)}/${format(st.a + st.b)}`;
  }).join("　");
}

async function place() {
  const current = viewGuard();
  if (S.probeCount === 0 && !S.posterior) {
    placePositions = makePlacementPositions();
    placeAnswers = [];
    catMeans = [];
  }
  if (placePositions.length !== 12) placePositions = makePlacementPositions();
  if (S.probeCount >= 30) { finishPlace(catFinalMean()); return; }
  // 前 12 题每档 2 题覆盖全部级别；后 18 题在当前估计边界附近集中探测
  const pos = S.probeCount < placePositions.length
    ? placePositions[S.probeCount]
    : Math.min(Math.max(Math.round(postMean()) + Math.floor(Math.random() * 301) - 150, 1), 10987);
  let w = null;
  for (let k = 0; k < 3; k++) {
    try { w = await fetch(`${API}/api/v1/quiz?pos=${pos}&seed=${Date.now() % 99991}`).then(r => r.json()); } catch (e) {}
    if (!current()) return;
    if (w && w.options && w.options.length >= 4) break;
    w = null;
  }
  if (!w) {
    $("#app").innerHTML = `<div class="card center"><p class="muted">网络异常，请重试</p><div class="row"><button class="act" id="bPlaceRetry">重试</button></div></div>`;
    $("#bPlaceRetry").onclick = place;
    return;
  }
  renderChips();
  const band = PLACEMENT_BANDS.findIndex(b => w.pos >= b.lo && w.pos <= b.hi) + 1;
  $("#app").innerHTML = `<div class="card center">
    <h2>智能定级 · 第 ${escapeHTML(S.probeCount + 1)}/30 题 · 第 ${band} 区间</h2>
    <div><span class="big">${escapeHTML(w.word)}</span><button class="playw" data-t="${escapeHTML(w.word)}">▶</button></div>
    <div style="text-align:left;margin-top:10px">${w.options.map((o, i) => `<button class="opt" data-i="${i}">${escapeHTML(o.text)}</button>`).join("")}</div>
    <div class="row" style="margin-top:10px"><button class="act ghost" id="bUnknown">不认识</button></div>
    <div class="progress"><i style="width:${S.probeCount / 30 * 100}%"></i></div>
    <p class="muted" style="margin-top:10px">不确定请点「不认识」，不要猜</p>
  </div>`;
  bindPlays();
  playText(w.word);
  const answerCurrent = viewGuard();
  const answer = (ok, guessed, btn) => {
    if (!answerCurrent()) return;
    document.querySelectorAll(".opt").forEach(x => {
      x.disabled = true;
      if (w.options[+x.dataset.i].ok) x.classList.add("right");
    });
    $("#bUnknown").disabled = true;
    if (!ok && guessed && btn) btn.classList.add("wrong");
    placeAnswers[S.probeCount] = ok;
    recordKnowledge(w.word, w.pos, ok, true);
    posteriorUpdate(w.pos, ok ? 1 : 0, 1.0, guessed ? 0.25 : 0);
    catMeans.push(Math.round(postMean()));
    S.log.push({ eventId: (crypto.randomUUID ? crypto.randomUUID().toLowerCase() : Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, "0")).join("")), d: today(), word: w.word, rating: ok ? 4 : 1, kind: "placement" });
    if (!ok && !S.pendingNew.find(x => x.word === w.word)) S.pendingNew.push(w);
    save();
    setTimeout(() => { if (answerCurrent()) place(); }, 450);
  };
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(w.options[+b.dataset.i].ok, true, b));
  $("#bUnknown").onclick = () => answer(false, false, null);
}

function finishPlace(r) {
  S.calibrated = true;
  S.frontier = placementPointer();
  S.pointer = S.frontier;
  // 保留 30 题形成的后验供每日追踪，不用单点估值重置它
  save();
  $("#app").innerHTML = `<div class="card center">
    <h2>定级完成</h2>
    <div class="score">预计认识 ${expectedKnown()} 词</div>
    <p class="muted">当前级别：${LVL_NAME[lvlOfPos(S.frontier)]} · 发词位置 ${escapeHTML(S.frontier)}<br>${placementScoreText()}<br>新词将从这个位置开始，${S.pendingNew.length} 个答错词会优先补学</p>
    <div class="row"><button class="act" id="bGo">开始学习</button></div>
  </div>`;
  renderChips();
  $("#bGo").onclick = home;
}

/* ---- 学习卡 ---- */
function step() {
  stopAudio();
  if (session.idx >= session.queue.length) return maybeQuiz();
  const item = session.queue[session.idx];
  if (item.kind === "learn") showLearn(item);
  else if (item.kind === "probe") showProbe(item);
  else showReview(item);
}

/* ---- v1.3 探测题：与复习测验同形态（4选1），用户无感知；答错进明日新词候选 ---- */
async function showProbe(item) {
  const current = sessionViewGuard(item);
  const w = item.detail, pos = w.pos || S.pointer;
  let quiz = null;
  try { quiz = await fetch(`${API}/api/v1/quiz?pos=${pos}&seed=${Date.now() % 99991}&mode=${w.reverse ? "reverse" : "forward"}`).then(r => r.json()); } catch (e) {}
  if (!current()) return;
  if (!quiz || !quiz.options || quiz.options.length < 4) {   // 出题失败直接跳过，不影响主流程
    session.idx++; save(); return step();
  }
  const isRev = w.reverse && quiz.mode === "reverse" && quiz.prompt;
  $("#app").innerHTML = `<div class="card center">
    <h2>复习 ${session.idx + 1}/${session.queue.length}</h2>
    ${isRev
      ? `<div><span class="big" style="font-size:30px">${escapeHTML(quiz.prompt)}</span></div><p class="muted" style="margin:10px 0 4px">回想它的英文单词：</p>`
      : `<div><span class="big">${escapeHTML(w.word)}</span><button class="playw" data-t="${escapeHTML(w.word)}">▶</button></div><p class="muted" style="margin:10px 0 4px">选出正确词义：</p>`}
    <div style="text-align:left">${quiz.options.map((o, i) => `<button class="opt" data-i="${i}">${escapeHTML(o.text)}</button>`).join("")}</div>
    <div class="progress"><i style="width:${session.idx / session.queue.length * 100}%"></i></div>
  </div>`;
  bindPlays();
  if (!isRev) playText(w.word);   // 反向回想不放音，避免泄题
  const answerCurrent = sessionViewGuard(item);
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (!answerCurrent()) return;
    const ok = quiz.options[+b.dataset.i].ok;
    document.querySelectorAll(".opt").forEach(x => {
      x.disabled = true;
      if (quiz.options[+x.dataset.i].ok) x.classList.add("right");
    });
    if (!ok) b.classList.add("wrong");
    answerProbe(w, ok);
    save();
    setTimeout(() => { if (answerCurrent()) { session.idx++; save(); step(); } }, 650);
  });
}

/* v1.4 探测作答：全额证据；正向猜测率 0.25，反向回想为 0；答错 → 进明日新词候选 */
function answerProbe(w, ok) {
  posteriorUpdate(w.pos || S.pointer, ok ? 1 : 0, 1.0, w.reverse ? 0 : 0.25);
  S.log.push({ eventId: (crypto.randomUUID ? crypto.randomUUID().toLowerCase() : Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, "0")).join("")), d: today(), word: w.word, rating: ok ? 4 : 1, kind: "probe", reverse: !!w.reverse });
  if (!ok && !S.cards[w.word] && !S.pendingNew.find(x => x.word === w.word)) {
    S.pendingNew.push({ word: w.word, pos: w.pos });
  }
}

/* ---- 当日新词验收测试（4选1） ---- */
function maybeQuiz() {
  const learnedToday = [...new Set(S.log.filter(l => l.d === today() && l.kind === "learn").map(l => l.word))];
  // 旧存档可能只有 quizDay；保留旧存档的已完成含义。
  if (!learnedToday.length || (!S.quizProgressDay && S.quizDay === today())) return doneDay();
  const completed = S.quizProgressDay === today() ? (S.quizCompleted || []) : [];
  const remaining = learnedToday.filter(w => !completed.includes(w));
  if (!remaining.length) return doneDay();
  quizRound(remaining, 0);
}

async function quizRound(words, i) {
  const current = viewGuard(), state = S, currentSession = session;
  if (i >= words.length) { S.quizDay = today(); save(); return doneDay(); }
  const w = words[i];
  const pos = S.cards[w] ? S.cards[w].pos : 1200;
  let q = null;
  try { q = await fetch(`${API}/api/v1/quiz?pos=${pos}&seed=${Date.now() % 99991}`).then(r => r.json()); } catch (e) {}
  if (!current() || session !== currentSession) return;
  if (!q || !q.options || q.options.length !== 4) {
    $("#app").innerHTML = `<div class="card center"><h2>验收题暂不可用</h2>
      <p class="muted">第 ${i + 1} 题加载失败，已完成题目的评分已保存。本次验收尚未完成。</p>
      <div class="row"><button class="act" id="bQuizRetry">重试本题</button><button class="ghost" id="bQuizLater">稍后再做</button></div></div>`;
    $("#bQuizRetry").onclick = () => quizRound(words, i);
    $("#bQuizLater").onclick = () => doneDay();
    return;
  }
  $("#app").innerHTML = `<div class="card center">
    <h2>验收测试 ${i + 1}/${words.length} · 今天学的还记得吗？</h2>
    <div><span class="big">${escapeHTML(w)}</span><button class="playw" data-t="${escapeHTML(w)}">▶</button></div>
    <div style="text-align:left;margin-top:10px">${q.options.map((o, k) => `<button class="opt" data-i="${k}">${escapeHTML(o.text)}</button>`).join("")}</div>
    <div class="progress"><i style="width:${i / words.length * 100}%"></i></div>
    <p class="muted" style="margin-top:10px">答对 → 明天复习见 · 答错 → 进入薄弱词，今晚就定制例句</p>
  </div>`;
  bindPlays();
  playText(w);
  const answerCurrent = viewGuard();
  document.querySelectorAll(".opt").forEach(b => b.onclick = async () => {
    if (!answerCurrent() || session !== currentSession) return;
    const ok = q.options[+b.dataset.i].ok;
    document.querySelectorAll(".opt").forEach(x => {
      x.disabled = true;
      if (q.options[+x.dataset.i].ok) x.classList.add("right");
    });
    if (!ok) b.classList.add("wrong");
    await review(w, ok ? 3 : 1, 1.0);   // 验收是客观实测：权重 1.0（强于复习的 0.2/0.3）
    if (S !== state || session !== currentSession) return;
    if (S.quizProgressDay !== today()) { S.quizProgressDay = today(); S.quizCompleted = []; }
    if (!S.quizCompleted.includes(w)) S.quizCompleted.push(w);
    save();
    setTimeout(() => { if (answerCurrent() && session === currentSession) quizRound(words, i + 1); }, 650);
  });
}

async function wordDetail(word, pos) {
  try {
    const resp = await fetch(`${API}/api/v1/lexicon/word?word=${encodeURIComponent(word)}`);
    if (resp.ok) {
      const result = await resp.json();
      if (result && typeof result.word === "string" && result.word.toLowerCase() === word.toLowerCase()) return result;
    }
  } catch (e) {}
  return { word, pos, senses: [], sentences: [], loadError: true };
}

/* 例句曝光埋点：用于后续评估"薄弱词复现 → 3/7/30 天记忆效果" */
function sentenceHash(text) {
  let h = 2166136261;
  for (const b of new TextEncoder().encode(text)) h = Math.imul(h ^ b, 16777619) >>> 0;
  return h.toString(16);
}
function logExposure(word, source, text, played = false, score = null) {
  if (!word) return;
  S.log.push({ eventId: (crypto.randomUUID ? crypto.randomUUID().toLowerCase() : Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, "0")).join("")), d: today(), ts: new Date().toISOString(), word, rating: 3, kind: "exposure",
               source, sentenceId: sentenceHash(text), played, ...(score === null ? {} : { score }) });
}
function logSentenceExposures(text, source, played = false) {
  if (!text) return;
  const weak = [...new Set(S.log.filter(l => l.rating <= 2 && l.d >= addDays(today(), -7)).map(l => l.word))];
  const lower = text.toLowerCase();
  for (const w of weak) {
    const esc = w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    if (new RegExp(`\\b${esc}\\b`, "i").test(lower)) logExposure(w, source, text, played);
  }
}

function sentenceBlock(word, personal, sents) {
  if (S.cards[word] && isMastered(S.cards[word])) personal = null;   // 已掌握词不再显示旧个性化例句
  const TIER = { 1: "基础", 2: "进阶", 3: "挑战" };
  const list = Array.isArray(sents) ? sents : (sents ? [{ tier: 1, text: sents }] : []);
  let html = "";
  if (personal) html += `<div class="sent"><span class="tag p">个性化</span>${escapeHTML(personal.text)}<button class="plays" data-t="${escapeHTML(personal.text)}">▶</button><button class="plays bad" data-t="${escapeHTML(personal.text)}" data-w="${escapeHTML(word)}" data-kind="personal" title="换一句">↻</button>${personal.zh ? `<div class="zh">${escapeHTML(personal.zh)}</div>` : ""}</div>`;
  list.forEach(s => {
    html += `<div class="sent"><span class="tag s">${TIER[s.tier] || "例句"}</span>${escapeHTML(s.text)}<button class="plays" data-t="${escapeHTML(s.text)}">▶</button><button class="plays bad" data-t="${escapeHTML(s.text)}" data-w="${escapeHTML(word)}" data-kind="static" title="换一句">↻</button>${s.zh ? `<div class="zh">${escapeHTML(s.zh)}</div>` : ""}</div>`;
  });
  if (!html) html = `<div class="sent" id="pendingSent"><span class="tag s">例句</span><span class="muted">生成中…</span></div>`;
  if (personal) logSentenceExposures(personal.text, "personal", false);
  list.forEach(s => logSentenceExposures(s.text, "trio", false));
  return { html, has: !!(personal || list.length), first: personal ? personal.text : (list[0] ? list[0].text : ""),
           texts: [...(personal ? [personal.text] : []), ...list.map(s => s.text)] };
}

function hasMeaning(word) {
  return (Array.isArray(word.senses) && word.senses.some(s => s && typeof s.text === "string" && s.text.trim())) ||
    (typeof word.sense === "string" && !!word.sense.trim());
}

async function showLearn(item) {
  const current = sessionViewGuard(item), state = S, currentSession = session;
  let w = item.detail;
  if (!hasMeaning(w)) {
    const full = await wordDetail(w.word, w.pos);
    if (!current()) return;
    if (!full.loadError) { full.fromPending = w.fromPending; w = full; item.detail = full; }
  }
  const personal = personalSentence(w.word);
  const sents = w.sentences || (w.static ? [{ tier: 1, text: w.static }] : []);
  const sb = sentenceBlock(w.word, personal, sents);
  const available = hasMeaning(w);
  const senseHtml = (Array.isArray(w.senses) ? w.senses : []).filter(s => s && typeof s.text === "string" && s.text.trim()).map(s => `<span><i>${escapeHTML(s.pos || "·")}</i>${escapeHTML(s.text)}</span>`).join("")
    || (available ? `<span>${escapeHTML(w.sense)}</span>` : `<span class="muted">词义暂不可用，请重试或稍后再学。</span><button class="ghost" id="bRetrySense">重新加载</button>`);
  $("#app").innerHTML = `<div class="card">
    <h2>新词 ${session.idx + 1}/${session.queue.length} · ${lvlName(w)}</h2>
    <div><span class="big">${escapeHTML(w.word)}</span><button class="playw" data-t="${escapeHTML(w.word)}">▶</button></div>
    <div class="phon">${escapeHTML(w.phonetic ? "/" + w.phonetic + "/" : "")}</div>
    <div class="sense">${senseHtml}</div>
    ${sb.html}
    <div class="muted" id="trioStatus"></div>
    <div class="row">
      ${SR ? `<button class="icon" id="bShadow">🎤 跟读</button>` : ""}
      <button class="act warn" id="bWeak" ${available ? "" : "disabled"}>不熟悉</button>
      <button class="act ok" id="bNext" ${available ? "" : "disabled"}>学会了 →</button>
    </div>
    ${available ? "" : '<div class="row"><button class="ghost" id="bSkipMeaning">稍后再学</button></div>'}
    <div class="progress"><i style="width:${session.idx / session.queue.length * 100}%"></i></div>
    ${SR ? '<p class="muted">跟读语音可能由浏览器提供商处理。</p>' : ""}
    <div class="muted" id="shadowOut" style="margin-top:8px"></div>
  </div>`;
  bindPlays();
  const active = sessionViewGuard(item);
  if ($("#bRetrySense")) $("#bRetrySense").onclick = () => showLearn(item);
  if ($("#bSkipMeaning")) $("#bSkipMeaning").onclick = () => {
    if (!active()) return;
    if (!S.cards[w.word] && !S.pendingNew.some(x => x.word === w.word)) S.pendingNew.push({word: w.word, pos: w.pos});
    session.idx++; save(); step();
  };
  let sentence = sb.first;
  autoPlaySequence(w.word, sb.texts);
  if (SR) $("#bShadow").onclick = () => {
    const target = sentence;
    if (!target) { $("#shadowOut").textContent = "例句还在生成，稍等"; return; }
    $("#shadowOut").textContent = "请朗读例句；语音可能由浏览器提供商处理。";
    shadow(target, res => {
      if (!active()) return;
      if (!res) { $("#shadowOut").textContent = "语音识别失败，请检查麦克风权限后重试。"; return; }
      const exp = tokens(target), got = new Set(tokens(res.text));
      const hit = exp.filter(t => got.has(t)).length;
      const pct = Math.round(hit / exp.length * 100);
      logExposure(w.word, "shadow", target, true, pct);
      const conf = Number.isFinite(res.confidence) ? Math.round(res.confidence * 100) : null;
      $("#shadowOut").innerHTML = `识别：${escapeHTML(res.text)}<br>完整度 <span class="${pct >= 80 ? "hl" : "rec"}" style="font-size:18px;font-weight:700">${pct}%</span>${conf === null ? "" : ` · 识别置信度 <span class="${conf >= 75 ? "hl" : "rec"}" style="font-size:18px;font-weight:700">${conf}%</span>`}<br>完整度是目标词命中比例；识别置信度不代表发音准确度。`;
    });
  };
  let acted = false;
  const act = async rating => {
    if (acted || !active() || !available) return;
    acted = true;
    $("#bWeak").disabled = true; $("#bNext").disabled = true;
    await learn(w.word, w.pos, rating, w.fromPending === true);
    if (S !== state || session !== currentSession) return;
    currentSession.learnedToday++;
    if (!active()) { save(); return; }
    currentSession.idx++; save(); step();
  };
  $("#bWeak").onclick = () => act(1);
  $("#bNext").onclick = () => act(3);
  async function loadTrio() {
    const status = $("#trioStatus");
    if (status) status.textContent = "正在补充例句…";
    const weak = [...new Set(S.log.filter(l => l.rating <= 2 && l.d >= addDays(today(), -7)).map(l => l.word))].slice(0, 15).join(",");
    try {
      const response = await fetch(`${API}/api/v1/sentence/trio?word=${encodeURIComponent(w.word)}&weak=${encodeURIComponent(weak)}&cap=${S.pointer + 10}`);
      if (!response.ok) throw new Error("例句请求失败");
      const r = await response.json();
      if (!active()) return;
      if (!Array.isArray(r.sentences) || !r.sentences.length) throw new Error("暂无可用例句");
      w.sentences = r.sentences;
      const newSb = sentenceBlock(w.word, personalSentence(w.word), r.sentences);
      document.querySelectorAll("#app .sent").forEach(e => e.remove());
      const anchor = document.querySelector("#app .sense");
      if (anchor) anchor.insertAdjacentHTML("afterend", newSb.html);
      bindPlays();
      if (!sentence && newSb.texts.length) autoPlaySequence(w.word, newSb.texts);
      sentence = newSb.first;
      if (status) {
        status.textContent = r.sentences.length < 3 ? "部分例句暂不可用。" : "";
        if (r.sentences.length < 3) {
          const retry = document.createElement("button");
          retry.className = "ghost"; retry.textContent = "重新加载例句";
          retry.onclick = loadTrio; status.append(" ", retry);
        }
      }
    } catch (_) {
      if (!active() || !status) return;
      const pending = $("#pendingSent");
      if (pending) pending.remove();
      status.textContent = "例句暂不可用。";
      const retry = document.createElement("button");
      retry.className = "ghost"; retry.textContent = "重新加载例句";
      retry.onclick = loadTrio; status.append(" ", retry);
    }
  }
  if (!personal && sents.length < 3) loadTrio();
  // 巩固句：新词例句 40% 概率织入近期薄弱词（每天 ≤3 次，先查句库共现再生成）
  const wk = today();
  if (S.weaveDay !== wk) { S.weaveDay = wk; S.weaveCount = 0; }
  const weakPool = [...new Set(S.log.filter(l => l.rating <= 2 && l.d >= addDays(today(), -7)).map(l => l.word))]
    .filter(x => x !== w.word && !(S.cards[x] && isMastered(S.cards[x])));
  if ((!AUTH || AUTH.accountId) && !personal && weakPool.length && S.weaveCount < 3 && Math.random() < 0.4) {
    const weakW = weakPool[Math.floor(Math.random() * weakPool.length)];
    S.weaveCount++; save();
    personalHeaders().then(headers => fetch(`${API}/api/v1/sentence/weave?word=${encodeURIComponent(w.word)}&weak=${encodeURIComponent(weakW)}&cap=${S.pointer + 10}&device=${deviceId()}`, { headers }))
      .then(r => r.json()).then(r => {
        if (!active() || !r.text || (S.rejectedPersonalized?.[w.word] || []).includes(r.text)) return;
        logExposure(weakW, "weave", r.text, false);
        const anchor = document.querySelector("#app .sense");
        if (!anchor) return;
        anchor.insertAdjacentHTML("afterend",
          `<div class="sent"><span class="tag" style="color:#5f9cec;border:1px solid #2a4a6e">巩固</span>${escapeHTML(r.text)}<button class="plays" data-t="${escapeHTML(r.text)}">▶</button><button class="plays bad" data-t="${escapeHTML(r.text)}" data-w="${escapeHTML(w.word)}" data-kind="weave" title="换一句">↻</button> <span class="zh">（复习词：${escapeHTML(weakW)}）</span>${r.zh ? `<div class="zh">${escapeHTML(r.zh)}</div>` : ""}</div>`);
        bindPlays();
      }).catch(() => {});
  }
}

function bindPlays() {
  document.querySelectorAll(".plays,.playw").forEach(b => {
    b.onclick = ev => { ev.stopPropagation(); playText(b.dataset.t); };
  });
  // ↻ 换一句：上报/移除并重生（用户无需判断好坏，纯偏好操作）
  document.querySelectorAll(".bad").forEach(b => {
    b.onclick = async ev => {
      ev.stopPropagation();
      const w = b.dataset.w, kind = b.dataset.kind, text = b.dataset.t;
      const sentEl = b.closest(".sent");
      if (sentEl) sentEl.style.opacity = ".35";
      try {
        if (kind !== "static") { rejectPersonalSentence(w, text); save(); }
        else { await fetch(`${API}/api/v1/sentence/report?word=${encodeURIComponent(w)}&text=${encodeURIComponent(text)}`, { method: "POST", headers: authHeaders() }); }
      } catch (e) { if (kind !== "static") { alert("无法保存例句修改，请先释放本机空间并导出进度。"); return; } }
      try {
        if (kind === "static") {
          // 触发补档并重取该词条
          await fetch(`${API}/api/v1/sentence/trio?word=${encodeURIComponent(w)}&cap=${S.pointer + 10}`).then(r => r.json());
          const pos = (S.cards[w] && S.cards[w].pos) || S.pointer;
          const r2 = await fetch(`${API}/api/v1/lexicon/at?pos=${pos}&n=20`).then(r => r.json());
          const wd = r2.words.find(x => x.word === w);
          const fresh = wd && (wd.sentences || []).find(x => x.text !== text);
          if (fresh && sentEl) {
            const TIER = { 1: "基础", 2: "进阶", 3: "挑战" };
            sentEl.outerHTML = `<div class="sent"><span class="tag s">${TIER[fresh.tier] || "例句"}</span>${escapeHTML(fresh.text)}<button class="plays" data-t="${escapeHTML(fresh.text)}">▶</button><button class="plays bad" data-t="${escapeHTML(fresh.text)}" data-w="${escapeHTML(w)}" data-kind="static" title="换一句">↻</button>${fresh.zh ? `<div class="zh">${escapeHTML(fresh.zh)}</div>` : ""}</div>`;
            bindPlays();
          } else if (sentEl) sentEl.remove();
        } else {
          // 换句也持久化任务，超时后仍能在回到主页时取回。
          const state = S, owner = deviceId();
          const id = crypto.randomUUID ? crypto.randomUUID() : Array.from(crypto.getRandomValues(new Uint8Array(16)), x => x.toString(16).padStart(2, "0")).join("");
          const job = { id, date: today(), weakKey: w, weakWords: [w], learnedMaxPos: Math.min(12000, S.pointer + 10),
            replace: false, owner, status: "queued", personalVersions: reservePersonalVersions(S, [w]) };
          if (!S.personalJobs) S.personalJobs = [];
          S.personalJobs.push(job); S.personalJobs = S.personalJobs.slice(-100); save();
          await refreshPersonalJobs();
          if (S !== state || deviceId() !== owner) return;
          const s = personalSentence(w);
          if (s && s.text !== text && sentEl) {
            sentEl.outerHTML = `<div class="sent"><span class="tag p">个性化</span>${escapeHTML(s.text)}<button class="plays" data-t="${escapeHTML(s.text)}">▶</button><button class="plays bad" data-t="${escapeHTML(s.text)}" data-w="${escapeHTML(w)}" data-kind="personal" title="换一句">↻</button>${s.zh ? `<div class="zh">${escapeHTML(s.zh)}</div>` : ""}</div>`;
            bindPlays();
          } else if (sentEl) sentEl.remove();
        }
      } catch (e) { if (sentEl) sentEl.remove(); }
    };
  });
}

/* ---- 复习卡：先 4 选 1 测试，再出答案卡 ---- */
const stageLabel = c => c.fsrs ? (isMastered(c) ? "已掌握" : `稳定≈${Math.round(c.fsrs.stability)}天`) : (c.stage === 6 ? "已掌握" : c.stage === 5 ? "长期池" : "D" + c.stage);

// An async review must not redraw a page the user has already left.
function viewGuard() {
  const state = S, node = $("#app").firstElementChild;
  return () => S === state && node && node.parentElement === $("#app");
}

function sessionViewGuard(item) {
  const current = viewGuard(), currentSession = session, index = session.idx;
  return () => current() && session === currentSession && session.idx === index && session.queue[index] === item;
}

async function showReview(item) {
  const current = sessionViewGuard(item);

  const mature = c.fsrs && c.fsrs.stability >= 14;
  let quiz = null;
  try { quiz = await fetch(`${API}/api/v1/quiz?pos=${c.pos}&seed=${Date.now() % 99991}&mode=${mature ? "reverse" : "forward"}`).then(r => r.json()); } catch (e) {}
  if (!current()) return;

/* 答案卡：答错已记「忘记」，答对再选掌握程度 */
async function answerCard(item, quizOk, wrongRecorded = false) {
  const current = sessionViewGuard(item), state = S, currentSession = session;
  if (!current()) return;
  const word = item.word;
  const c = S.cards[word];
  if (!quizOk && !wrongRecorded) {
    await review(word, 1, undefined, true);
    if (S !== state || session !== currentSession) return;
    currentSession.reviewedToday++; save();
    if (!current()) return;
  }
  const d = await wordDetail(word, c.pos);
  if (!current()) return;
  let sents = d.sentences || [];
  if (!sents.length) { const t = await ensureSentence(word); if (t) sents = [{ tier: 1, text: t }]; }
  if (!current()) return;
  const personal = personalSentence(word);
  const sb = sentenceBlock(word, personal, sents);
  const answerSenses = d.senses.map(s => `<span><i>${escapeHTML(s.pos || "·")}</i>${escapeHTML(s.text)}</span>`).join("")
    || `<span class="muted">词义加载失败，请检查网络</span><button class="ghost" id="bRetryDetail">重新加载</button>`;
  $("#app").innerHTML = `<div class="card">
    <h2>${quizOk ? "✓ 答对了——这次掌握程度？" : "✗ 正确答案"}</h2>
    <div><span class="big">${escapeHTML(word)}</span><button class="playw" data-t="${escapeHTML(word)}">▶</button></div>
    <div class="phon">${escapeHTML(d.phonetic ? "/" + d.phonetic + "/" : "")}</div>
    <div class="sense">${answerSenses}</div>
    ${sb.html.replace('id="pendingSent"', "")}
    ${quizOk
      ? `<div class="row" style="margin-top:14px">
          <button class="act ghost" id="r2">困难</button>
          <button class="act ghost" id="r3">记得</button>
          <button class="act ok" id="r4">熟练</button>
        </div>`
      : `<div class="row" style="margin-top:14px"><button class="ghost" id="rUndo">撤销忘记</button><button class="act" id="rNext">继续 →</button></div>
         <p class="muted center" style="margin-top:8px">已记为「忘记」，降级并明天再见；误点可撤销重答</p>`}
  </div>`;
  bindPlays();
  if ($("#bRetryDetail")) $("#bRetryDetail").onclick = () => answerCard(item, quizOk, true);
  autoPlaySequence(word, sb.texts);
  const actionCurrent = sessionViewGuard(item);
  let rated = false;
  const go = async r => {
    if (rated) return;
    rated = true;
    document.querySelectorAll("#r2,#r3,#r4").forEach(b => b.disabled = true);
    await review(word, r);
    if (S !== state || session !== currentSession) return;
    currentSession.reviewedToday++;

    currentSession.idx++; save(); step();
  };
  if (quizOk) {
    $("#r2").onclick = () => go(2); $("#r3").onclick = () => go(3); $("#r4").onclick = () => go(4);
  } else {
    $("#rUndo").onclick = () => { undoReview(); showReview(item); };
    $("#rNext").onclick = () => { commitUndoReview(); session.idx++; save(); step(); };
  }
}

/* 每日结算时清理已掌握词的个性化映射，防止毕业后继续展示 */
function prunePersonalized() {
  for (const w of Object.keys(S.personalized || {})) {
    if (S.cards[w] && isMastered(S.cards[w])) {
      const text = S.personalized[w]?.text;
      if (typeof text === "string" && text) {
        try { rejectPersonalSentence(w, text); }
        catch (_) { localSaveFailed = true; }
      }
      else delete S.personalized[w];
    }
  }
}

function recordStudyDay(date) {
  if (!S.streakEvidence) {
    const baseDay = S.lastDay || null, baseStreak = S.streak || 0;
    const id = crypto.randomUUID ? crypto.randomUUID().toLowerCase() : Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, "0")).join("");
    S.streakEvidence = {baseId: baseDay ? id : "empty", baseDay, baseStreak, days:[]};
  }
  const evidence = S.streakEvidence;
  if (!evidence.days.includes(date)) evidence.days.push(date);
  evidence.days.sort();
  let last = evidence.baseDay || null, streak = evidence.baseStreak;
  if (last) {
    const days = new Set(evidence.days);
    let first = addDays(last, 1 - streak);
    while (first > "0001-01-01" && days.has(addDays(first, -1))) { first = addDays(first, -1); streak++; }
  }
  for (const current of evidence.days) {
    if (last && current <= last) continue;
    streak = last && last === addDays(current, -1) ? streak + 1 : 1;
    last = current;
  }
  S.lastDay = last; S.streak = streak;
}

let personalRefresh = null;
async function refreshPersonalJobs() {
  if (AUTH && !AUTH.accountId) return;
  if (personalRefresh) return personalRefresh;
  const state = S, owner = deviceId();
  personalRefresh = (async () => {
    let changed = false;
    for (const job of state.personalJobs || []) {
      if (job.owner !== owner || ["complete", "partial", "failed", "superseded"].includes(job.status)) continue;
      try {
        const response = await fetch(API + "/api/v1/personalize", {
          method: "POST", headers: { "Content-Type": "application/json", ...await personalHeaders() },
          body: JSON.stringify({ device: owner, date: job.date, weak_words: job.weakWords,
            learned_max_pos: job.learnedMaxPos, sync: true, replace: job.replace, request_id: job.id })
        });
        if (!response.ok) {
          if (!AUTH && response.status === 409 && S === state && deviceId() === owner) { job.status = "failed"; changed = true; }
          throw new Error("任务提交失败 " + response.status);
        }
        const r = await fetch(`${API}/api/v1/personalized/job?job_id=${encodeURIComponent(job.id)}&device=${encodeURIComponent(owner)}`, { headers: await personalHeaders() });
        if (!r.ok) throw new Error("任务查询失败 " + r.status);
        const result = await r.json();
        if (S !== state || deviceId() !== owner) return;
        if (job.status !== result.status) { job.status = result.status; changed = true; }
        if (result.status !== "superseded") {
          for (const row of result.sentences || []) {
            if ((state.rejectedPersonalized?.[row.target] || []).includes(row.text)) continue;
            if (state.cards[row.target] && isMastered(state.cards[row.target])) continue;
            if ((state.personalJobs || []).some(j => j.owner === owner && j.date > job.date &&
                j.weakWords.includes(row.target) && !["failed", "superseded"].includes(j.status))) continue;
            if (applyPersonalJobResult(state, job, row)) changed = true;
          }
        }
        if (result.status === "complete" && job.replace) {
          state.personalizedDay = job.date; state.personalizedWeak = job.weakKey; changed = true;
        }
      } catch (e) { /* 保留待处理状态，下次进入主页或恢复网络时重试 */ }
    }
    if (changed && S === state && deviceId() === owner) save();
  })();
  try { await personalRefresh; } finally { personalRefresh = null; }
}

async function autoPersonalize() {
  if (AUTH && !AUTH.accountId) return;
  const date = today(), state = S, owner = deviceId();
  const status = message => { const el = document.querySelector("#genOut"); if (el && S === state) el.textContent = message; };
  const weakToday = [...new Set(state.log.filter(l => l.d === date && l.rating <= 2).map(l => l.word))]
    .filter(w => { const c = state.cards[w]; return !c || !isMastered(c); });
  const weakKey = [...weakToday].sort().join(",");
  if (!weakToday.length) {
    state.personalizedDay = date; state.personalizedWeak = ""; save();
    status("今天没有薄弱词，无需定制"); return;
  }
  if (!state.personalJobs) state.personalJobs = [];
  let job = [...state.personalJobs].reverse().find(j => j.replace && j.owner === owner && j.date === date && j.weakKey === weakKey &&
    !["partial", "failed", "superseded"].includes(j.status));
  if (!job) {
    const id = crypto.randomUUID ? crypto.randomUUID() : Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, "0")).join("");
    const words = weakToday.slice(0, 15);
    let versions;
    try { versions = reservePersonalVersions(state, words); }
    catch (_) { status("无法保存例句版本，请先导出进度并释放空间。"); return; }
    job = { id, date, weakKey, weakWords: words, learnedMaxPos: Math.min(12000, state.pointer + 10),
      replace: true, owner, status: "queued", personalVersions: versions };
    state.personalJobs.push(job);
    state.personalJobs = state.personalJobs.slice(-100);
    await save(); // 请求之前记录任务与幂等键，重启后可以重试。
    if (localSaveFailed || S !== state || deviceId() !== owner) { status("无法保存任务，请先导出进度并释放空间。"); return; }
  }
  for (let k = 0; k < 10; k++) {
    status("正在为薄弱词定制例句…");
    await refreshPersonalJobs();
    if (S !== state || deviceId() !== owner) return;
    if (job.status === "complete") { status("✓ 薄弱词例句已就绪"); return; }
    if (["partial", "failed", "superseded"].includes(job.status)) {
      status("部分例句暂不可用，可稍后重新进入完成页重试；现有例句仍可使用。"); return;
    }
    await new Promise(res => setTimeout(res, 4000));
  }
  status("生成任务仍在处理中，稍后回到主页会继续取回结果。");
}

// Credentials are created only when a guest first needs personal data.
let guestCredentialRequest = null;
async function personalHeaders() {
  const session = AUTH;
  if (session) return authHeaders();
  let credential = localStorage.getItem("vocab_guest_credential_v1");
  if (!credential) {
    if (!guestCredentialRequest) guestCredentialRequest = (async () => {
      const response = await fetch(API + "/api/v1/auth/guest", {method:"POST"});
      if (!response.ok) throw new Error("无法创建游客凭证");
      const result = await response.json();
      if (!/^[a-f0-9]{64}$/.test(result.token || "")) throw new Error("游客凭证无效");
      localStorage.setItem("vocab_guest_credential_v1", result.token);
      return result.token;
    })().finally(() => { guestCredentialRequest = null; });
    credential = await guestCredentialRequest;
  }
  if (AUTH !== session) throw new Error("账号已切换");
  return {"X-Guest-Token": credential};
}

function deviceId() {
  if (typeof AUTH !== "undefined" && AUTH) return `u${AUTH.userId}`;
  let d = localStorage.getItem("vocab_device_v2");
  if (!d) {
    const bytes = crypto.getRandomValues(new Uint8Array(16));
    d = "web-" + Array.from(bytes, b => b.toString(16).padStart(2, "0")).join("");
    localStorage.setItem("vocab_device_v2", d);
  }
  return d;
}

/* ---------------- 独立留出水平校验（不影响后验、卡片与学习计划） ---------------- */
let validation = null;
async function startValidation() {
  const current = viewGuard();
  const r = await fetch(`${API}/api/v1/placement/set?seed=${encodeURIComponent("validation-" + deviceId() + "-" + Date.now())}`).then(r => r.json());
  if (!current()) return;
  const words = r.words.slice(0, 24).map((w, i) => ({ ...w, reverse: i % 2 === 1 }));
  validation = { words, idx: 0, posterior: null, correct: 0, failed: 0 };
  showValidation();
}

async function showValidation() {
  if (!validation) return;
  const current = viewGuard(), activeValidation = validation, index = validation.idx;
  if (validation.idx >= validation.words.length) return finishValidation();
  const w = validation.words[validation.idx];
  let q = null;
  try { q = await fetch(`${API}/api/v1/quiz?pos=${w.pos}&seed=${Date.now() % 99991}&mode=${w.reverse ? "reverse" : "forward"}`).then(r => r.json()); } catch (e) {}
  if (!current() || validation !== activeValidation || validation.idx !== index) return;
  if (!q || !q.options || q.options.length < 4) { validation.failed++; validation.idx++; return showValidation(); }
  const isRev = w.reverse && q.mode === "reverse" && q.prompt;
  $("#app").innerHTML = `<div class="card center">
    <h2>独立水平校验 ${validation.idx + 1}/${validation.words.length}</h2>
    <p class="muted">只用于检验估值偏差，不影响学习计划</p>
    ${isRev
      ? `<div><span class="big" style="font-size:30px">${escapeHTML(q.prompt)}</span></div><p class="muted">回想它的英文单词：</p>`
      : `<div><span class="big">${escapeHTML(w.word)}</span><button class="playw" data-t="${escapeHTML(w.word)}">▶</button></div><p class="muted">选出正确词义：</p>`}
    <div style="text-align:left">${q.options.map((o, i) => `<button class="opt" data-i="${i}">${escapeHTML(o.text)}</button>`).join("")}</div>
    <div class="progress"><i style="width:${validation.idx / validation.words.length * 100}%"></i></div>
  </div>`;
  bindPlays();
  if (!isRev) playText(w.word);
  const answerCurrent = viewGuard();
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (!answerCurrent() || validation !== activeValidation) return;
    const ok = q.options[+b.dataset.i].ok;
    document.querySelectorAll(".opt").forEach(x => {
      x.disabled = true;
      if (q.options[+x.dataset.i].ok) x.classList.add("right");
    });
    if (!ok) b.classList.add("wrong");
    validation.posterior = posteriorCalc(validation.posterior, w.pos, ok ? 1 : 0, 1.0, w.reverse ? 0 : 0.25);
    if (ok) validation.correct++;
    validation.idx++;
    setTimeout(() => { if (answerCurrent() && validation === activeValidation) showValidation(); }, 450);
  });
}

function finishValidation() {
  if (validation.failed > 0 || !validation.posterior) {
    $("#app").innerHTML = `<div class="card center">
      <h2>校验暂不可用</h2>
      <p class="muted">部分题目加载失败，本次结果不作为估值依据。请重试。</p>
      <div class="row"><button class="act" id="bValRetry">重新校验</button><button class="ghost" id="bValBack">返回设置</button></div>
    </div>`;
    validation = null;
    $("#bValRetry").onclick = startValidation;
    $("#bValBack").onclick = showSettings;
    return;
  }
  const mean = Math.round(posteriorMean(validation.posterior));
  const std = Math.round(posteriorStd(validation.posterior));
  const appMean = Math.round(postMean());
  const delta = appMean - mean;
  S.evalReport = { date: today(), mean, std, appMean, delta, correct: validation.correct, count: validation.words.length };
  save();
  const direction = Math.abs(delta) <= 500 ? "与当前估值基本一致" : (delta > 0 ? "当前估值可能偏高" : "当前估值可能偏低");
  $("#app").innerHTML = `<div class="card center">
    <h2>独立校验结果</h2>
    <div class="score">${mean}</div>
    <p class="muted">独立估值（±${std}） · 答对 ${validation.correct}/${validation.words.length}</p>
    <p style="font-size:16px">当前学习系统估值：<b>${appMean}</b><br>差值（当前 − 独立）：<b>${delta > 0 ? "+" : ""}${delta}</b></p>
    <p class="muted">${direction}<br>这次校验没有修改你的后验、卡片或后续发词位置。</p>
    <div class="row"><button class="act" id="bValBack">返回设置</button><button class="ghost" id="bValAgain">重新校验</button></div>
  </div>`;
  validation = null;
  $("#bValBack").onclick = showSettings;
  $("#bValAgain").onclick = startValidation;
}

function downloadBackupWithSchedulers(state, filename, owner) {

  const backup = structuredClone(state), slot = accountSlot(AUTH), token = AUTH && AUTH.token;

    const warnings = [];
    const verified = new Set();
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 10000);
    try {
      const headers = {Authorization: `Bearer ${token}`};
      const response = await fetch(API + "/api/v1/me/fsrs-schedulers", {headers, signal: controller.signal});
      let body;
      if (response.status === 413) {
        const keys = [...backupSchedulerWarnings(backup).keys].filter(key => /^[a-f0-9]{64}$/.test(key)).sort();
        if (keys.length > 4096) throw new Error("引用的参数版本过多");
        const resolved = Object.create(null);
        if (keys.length) {
          const head = await fetch(API + "/api/v1/me/state", {headers, signal: controller.signal});
          if (!head.ok) throw new Error(`HTTP ${head.status}`);
          const generation = (await head.json()).sync_generation;
          if (!/^[a-f0-9]{32}$/.test(generation || "")) throw new Error("无法确认服务器同步代次");
          for (let offset = 0; offset < keys.length; offset += 256) {
            const batch = keys.slice(offset, offset + 256);
            const lookup = await fetch(API + "/api/v1/me/fsrs-schedulers/resolve", {method:"POST", signal: controller.signal,
              headers:{...headers, "Content-Type":"application/json"}, body:JSON.stringify({generation, keys:batch})});
            if (!lookup.ok) throw new Error(`HTTP ${lookup.status}`);
            const result = await lookup.json(), found = result.versions, missing = result.missing;
            if (result.generation !== generation || !found || typeof found !== "object" || Array.isArray(found) ||
                !Array.isArray(missing) || new Set(missing).size !== missing.length ||
                [...Object.keys(found), ...missing].length !== batch.length ||
                [...Object.keys(found), ...missing].some(key => !batch.includes(key)) ||
                missing.some(key => Object.hasOwn(found, key))) throw new Error("服务器参数解析结果无效");
            for (const [key, value] of Object.entries(found)) Object.defineProperty(resolved, key, {value, enumerable:true});
          }
        }
        body = {versions:resolved};
      } else {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        body = await response.json();
      }
      if (!body.versions || typeof body.versions !== "object" || Array.isArray(body.versions)) throw new Error("参数备份格式无效");
      if (backup.fsrsSchedulers != null && (typeof backup.fsrsSchedulers !== "object" || Array.isArray(backup.fsrsSchedulers))) throw new Error("本机参数备份格式无效");
      const versions = Object.assign(Object.create(null), backup.fsrsSchedulers || {});
      const needed = backupSchedulerWarnings(backup).keys;
      let conflict = false;
      const incoming = Object.keys(body.versions).sort((a,b) => Number(needed.has(b)) - Number(needed.has(a)) || a.localeCompare(b));
      for (const key of incoming) {
        if (Object.hasOwn(versions, key)) {
          if (backupValueKey(versions[key]) !== backupValueKey(body.versions[key])) conflict = true;
          else verified.add(key);
        } else if (Object.keys(versions).length < 256) {

    } catch (_) {

    } finally { clearTimeout(timer); }
    if (!AUTH || AUTH.userId !== owner || AUTH.token !== token || accountSlot(AUTH) !== slot) return;

}

      if (localStorage.getItem(slotKey) !== null) { blockConcurrentSlotChange(slotKey); showAwaitingServer(); return; }

          const part = await deltaRequest(`/api/v1/me/state/snapshots/${manifest.snapshot_id}?page=${page}`, token);
          if (!current() || part.snapshot_id !== manifest.snapshot_id || part.page !== page || typeof part.data !== "string")
            throw new Error("服务器快照页无效，请先导出核对");
          return part.data;
        }, 16 * 1024 * 1024);
        if (!current() || !deltaMap(snapshot.state) || snapshot.sync_generation !== targetFence.generation ||
            snapshot.state_revision !== targetFence.revision || (snapshot.state.restoreEpoch ?? 0) !== targetFence.epoch)
          throw new Error("服务器快照内容无效，请先导出核对");
        const enriched = await deltaResolveSchedulers(snapshot.state, targetFence.generation, token);
        const raw = JSON.stringify(Object.assign(defaultState(), enriched));
        largeLocalValidateRaw(raw); parseLearningBackup(raw);
        const digest = await largeLocalDigest(raw);
        if (!digest.length || digest.length > 8 * 1024 * 1024) throw new Error("服务器进度超过本机存储上限，请先导出");
        await checkOld();
        const pendingWarning = before.primary.dirty || oldRecord.pending != null ? "本机有未同步修改或待确认上传，这些内容会保留在本机备份中，不会自动合并。" : "";
        if (!confirm(`${pendingWarning}服务器有 ${Object.keys(snapshot.state.cards || {}).length} 张卡，本机有 ${Object.keys(S.cards).length} 张。将替换本机进度，当前本机进度和同步记录会先备份。继续？`)) return "已取消";
        await checkOld();
        const head = await deltaRequest(`/api/v1/me/state/changes?after=${encodeURIComponent(targetFence.revision)}&generation=${targetFence.generation}&compact=true`, token);
        validateDeltaHead(head, targetFence.generation, targetFence.revision, targetFence.epoch);
        if (head.head_revision !== targetFence.revision) throw new Error("服务器进度已变化，请重新预览");
        await checkOld();
        const target = {base:snapshot.state,local:JSON.parse(raw),generation:targetFence.generation,revision:targetFence.revision,epoch:targetFence.epoch};
        const payload = JSON.stringify({primary:before.primary,sync:before.sync,target}), bytes = new TextEncoder().encode(payload);
        if (!bytes.length || bytes.length > 40 * 1024 * 1024) throw new Error("本机备份过大，请先导出");
        const fence = await normalTransitionRaw(slot), id = deltaID();
        const archive = {format:4,kind:"serverReload",slot,id,candidateId:before.candidate.record.id,nonce:fence.nonce,
          primaryVersion:before.primary.version,payload,length:bytes.length,sha256:deltaHex(new Uint8Array(await crypto.subtle.digest("SHA-256",bytes)))};
        const validated = await normalValidateReloadArchive(archive, slot, before.candidate.record.id);
        const record = {base:target.base,local:target.local,generation:target.generation,revision:target.revision,epoch:target.epoch,pending:null};
        const recordDigest = await normalSyncDigest(record);
        const primary = {...before.primary,version:deltaID(),raw,length:digest.length,sha256:digest.sha256,fence:targetFence,dirty:false};
        const {restoreProof:discardedRestoreProof,reloadProof:discardedReloadProof,...oldSync} = before.sync;
        const sync = {...oldSync,format:4,version:primary.version,record,recordLength:recordDigest.length,recordSha256:recordDigest.sha256,
          cleanProof:true,reloadProof:{batch_id:id,generation:target.generation,revision:target.revision,epoch:target.epoch,payload_sha256:validated.targetSha256}};
        await checkOld();
        const db = await normalDurableOpen();
        try {
          await new Promise((resolve,reject) => {
            let failure = null, ready = 0;
            const names = ["accounts","migrations","sync","transitions","cancellations","sourceRecoveries","sourceRecoveryBackups"];
            const tx = db.transaction(names,"readwrite",{durability:"strict"});
            if (tx.durability !== "strict") { tx.abort(); reject(new Error("浏览器不支持可靠的重新加载保存")); return; }
            const reads = names.slice(0,4).map(name => tx.objectStore(name).get(slot));
            const cancellation = tx.objectStore("cancellations").getKey(slot), recovery = tx.objectStore("sourceRecoveries").getKey(slot);
            const backups = tx.objectStore("sourceRecoveryBackups"), key = [slot,id], existing = backups.getKey(key);
            const count = backups.count(IDBKeyRange.bound([slot,""],[slot,"\uffff"]));
            const install = () => {
              if (++ready !== 8) return;
              if (!current() || JSON.stringify(reads[0].result) !== JSON.stringify(before.primary) ||
                  JSON.stringify(reads[1].result) !== JSON.stringify(before.candidate.record) || JSON.stringify(reads[2].result) !== JSON.stringify(before.sync) ||
                  JSON.stringify(reads[3].result) !== JSON.stringify(fence) || cancellation.result !== undefined || recovery.result !== undefined ||
                  existing.result !== undefined || count.result >= 8) {
                failure = new Error(count.result >= 8 ? "本机恢复备份已满，请先导出并核对" : "本机记录已变化，请先导出核对"); tx.abort(); return;
              }
              try { backups.put(archive,key); tx.objectStore("accounts").put(primary,slot); tx.objectStore("sync").put(sync,slot); }
              catch (error) { failure = error; tx.abort(); }
            };
            reads.forEach(read => { read.onsuccess = install; }); cancellation.onsuccess = install; recovery.onsuccess = install;
            existing.onsuccess = install; count.onsuccess = install;
            tx.oncomplete = resolve; tx.onabort = tx.onerror = () => reject(failure || tx.error || new Error("无法保存重新加载结果"));
          });
        } finally { db.close(); }
        installed = true;
        if (!current()) throw new Error("本机存档已保存，但账号或页面已变化，请先导出核对");
        await normalPrimaryLeaseVerify(lease, slot, owner, token);
        const legacy = await deltaIDB(slot,"get");
        if (!current() || JSON.stringify(legacy === undefined ? null : legacy) !== JSON.stringify(old.legacy) || await largeHasPrimaryOrRestore(slot) || !current())
          throw new Error("重新加载后旧记录已变化，请先导出核对");
        const prepared = await normalMigrationReadPrepared(slot);
        if (!current() || JSON.stringify(prepared.primary) !== JSON.stringify(primary) || JSON.stringify(prepared.sync) !== JSON.stringify(sync))
          throw new Error("重新加载后的本机记录已变化，请先导出核对");
        active.prepared = prepared; S = target.local; active.conflict = false; active.error = null;
        localSaveFailed = false; syncFailed = false; syncFailureMessage = ""; renderUserTag();
        return "服务器进度已加载，原本机进度及同步记录已备份";
      } finally {
        if (/^[a-f0-9]{32}$/.test(manifest?.snapshot_id || ""))
          try { await deltaRequest(`/api/v1/me/state/snapshots/${manifest.snapshot_id}`, token, {method:"DELETE"}); } catch (_) {}
      }
    });
  } catch (error) {
    if (installed && normalActive === active) { active.conflict = true; localSaveFailed = true; renderUserTag(); }
    throw error;
  } finally { active.syncing = false; finishSync(); normalSetBusy(active); }
}

async function reloadServerState() {
  if (normalActive) return reloadNormalServerState();
  if (largeActive) return reloadLargeServerState();
  if (!AUTH) throw new Error("请先登录");
  const owner = AUTH.userId, token = AUTH.token, slot = accountSlot(AUTH), before = JSON.stringify(S);
  if (deltaConcurrentSlots.has(slot)) throw new Error("本机进度已在其他页面变化，请先导出当前页面进度，再重新加载");
  const current = () => !!AUTH && AUTH.userId === owner && AUTH.token === token && accountSlot(AUTH) === slot && JSON.stringify(S) === before && observedSlotIsCurrent(slot);
  const remote = await pullState(owner);
  if (!remote || !remote.state) throw new Error("服务器没有可加载的进度");
  const guardVersion = guardedStateVersion(remote);
  const matchesPreview = value => !!value && value.updated_at === remote.updated_at &&
    value.state_revision === remote.state_revision && value.sync_generation === remote.sync_generation;
  if (!current()) throw new Error("本机进度已变化，请重试");
  const next = parseLearningBackup(JSON.stringify(remote.state));
  if (!confirm(missingSyncWarning(slot) + `服务器有 ${Object.keys(next.cards).length} 张卡，本机有 ${Object.keys(S.cards).length} 张。将替换本机进度，当前本机进度会先备份。`)) return "已取消";
  if (!current()) throw new Error("本机进度已变化，请重试");
  const latest = await pullState(owner);
  if (!matchesPreview(latest)) throw new Error("服务器进度已变化，请重试");
  if (!current()) throw new Error("本机进度已变化，请重试");
  try { localStorage.setItem(`vocab_before_restore_${slot}`, before); }
  catch (e) { throw new Error("无法备份本机进度，请先导出并释放空间"); }
  await runDeltaMutation(slot, async () => {
    if (!current()) throw new Error("本机进度已变化，请重试");
    const verified = await pullState(owner);
    if (!matchesPreview(verified)) throw new Error("服务器进度已变化，请重试");
    if (!current()) throw new Error("本机进度已变化，请重试");
  }, () => {
    if (!current()) throw new Error("本机进度已变化，请重试");
    clearTimeout(save._t);
    try {
      writeSlotAndMain(slot, next);
      const stamp = String(Math.max(Date.now() / 1000, Number(localStorage.getItem("vocab_write_ts") || 0) + 0.001));
      localStorage.setItem("vocab_write_ts", stamp); localStorage.setItem(slotClock(slot, "write"), stamp);
      markSlotSynced(slot);
      clearMissingSyncBlock(slot);
    } catch (e) {
      localSaveFailed = true; renderUserTag();
      throw new Error("无法保存服务器进度，请先导出并释放空间");
    }
    S = next; localSaveFailed = false; syncFailed = false; renderUserTag();
  }, !!guardVersion);
  return "服务器进度已加载，原本机进度已备份";
}

$("#btnUser").onclick = () => { commitUndoReview(); userMenu(); };

async function boot() {
  if (corruptStartup.length) {
    // 不允许空白内存状态同步或覆盖损坏槽位；由用户先导出、再决定是否清除。
    ["#btnUser", "#btnSettings", "#btnStats"].forEach(id => { const el = $(id); if (el) el.disabled = true; });
    $("#app").innerHTML = `<div class="card center"><h2>本机数据无法读取</h2>
      <p>原始数据仍保留在浏览器中。请先导出损坏的学习数据；清除后可重新登录并尝试从服务器恢复。</p>
      <div class="row"><button class="ghost" id="bExportCorrupt">导出原始学习数据</button></div>
      <div class="row"><button class="act" id="bClearCorrupt">清除损坏数据并重新启动</button></div></div>`;
    $("#bExportCorrupt").onclick = () => {
      const state = corruptStartup.find(x => x.key.startsWith("vocab_v1") || x.key.startsWith("vocab_v2") || x.key.startsWith("vocab_v3"));
      if (!state) { alert("学习数据未损坏，只有登录信息无法读取。请重新登录。"); return; }
      const url = URL.createObjectURL(new Blob([state.raw], {type: "application/octet-stream"}));
      const a = document.createElement("a"); a.href = url; a.download = `vocab-damaged-${today()}.txt`; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    };
    $("#bClearCorrupt").onclick = () => {
      if (!confirm("确认已导出需要保留的原始学习数据？这会从浏览器删除损坏的内容。")) return;
      for (const item of corruptStartup) localStorage.removeItem(item.key);
      // 损坏的是切换目标槽位时，当前主槽位可能属于上一账号；重新登录后再拉取。
      if (corruptStartup.some(x => x.key.startsWith("vocab_v1_") || x.key.startsWith("vocab_v2_") || x.key.startsWith("vocab_v3_"))) {
        localStorage.removeItem("vocab_auth"); localStorage.removeItem("vocab_guest");
      }
      if (corruptStartup.some(x => x.key === "vocab_v1")) {
        localStorage.removeItem("vocab_write_ts"); localStorage.removeItem("vocab_last_sync_ts");
      }
      location.reload();
    };
    return;
  }
  renderUserTag();
  if (AUTH) {
    const owner = AUTH.userId, token = AUTH.token, slot = accountSlot(AUTH), mainOwner = localStorage.getItem("vocab_v1_owner");
    const stillCurrent = () => AUTH && AUTH.userId === owner && AUTH.token === token && accountSlot(AUTH) === slot;
    const root = S;
    try {
      const loaded = loadSlot(slot);
      if (loaded === null) return;
      if (!loaded) S = defaultState();
      if (await routePendingNormalTransition(owner, token, slot)) return;
      if (await routePendingLargeRestore(owner, token, slot)) return;
      if (!stillCurrent()) return;
      if (localStorage.getItem(awaitingServerSlot(slot))) { if (!loaded) S = defaultState(); showAwaitingServer(); return; }
      let trusted = loaded;
      if (!loaded && mainOwner === slot) { S = root; trusted = true; localStorage.setItem(slotClock(slot, "dirty"), "1"); }
      else if (!loaded) S = defaultState();
      S = Object.assign(defaultState(), S);
      loadSlotClocks(slot);
      localSaveFailed = false;
      if (!AUTH.accountId) { writeSlotAndMain(slot, S); home(); return; }
      if (trusted) {
        writeSlotAndMain(slot, S);
        syncFromServer().then(() => { if (stillCurrent()) home(); }).catch(() => { if (stillCurrent()) home(); });
      } else {
        // 无可信槽位时只读服务器，不能先把空状态或上一账号状态上传。
        const before = JSON.stringify(S);
        recoverMissingSyncSlot(owner, token, slot, () => stillCurrent() && JSON.stringify(S) === before).catch(e => {
          if (stillCurrent()) blockMissingSyncSlot(slot);
          throw e;
        }).then(async recovered => {
          if (!stillCurrent() || JSON.stringify(S) !== before) return;
          if (localStorage.getItem(slot) !== null) { blockConcurrentSlotChange(slot); return; }
          if (recovered) {
            writeSlotAndMain(slot, recovered); S = recovered;
            localStorage.setItem(slotClock(slot, "dirty"), "1");
            await syncFromServer();
            return;
          }
          localStorage.setItem(awaitingServerSlot(slot), "1");
          const remote = await pullState(owner);
          if (!stillCurrent() || JSON.stringify(S) !== before) return;
          if (localStorage.getItem(awaitingServerSlot(slot)) !== "1") { blockConcurrentSlotChange(slot); return; }
          if (localStorage.getItem(slot) !== null) { blockConcurrentSlotChange(slot); return; }
          if (!remote) { syncFailed = true; return; }
          if (remote.state) {
            const next = Object.assign(defaultState(), remote.state);
            const bootstrapFence = beginDeltaBootstrap(remote, slot);
            writeSlotAndMain(slot, next); S = next;
            const stamp = String(Date.now() / 1000);
            localStorage.setItem("vocab_write_ts", stamp); localStorage.setItem(slotClock(slot, "write"), stamp);
            markSlotSynced(slot);
            void primeDeltaBaseline(remote, owner, token, slot, JSON.stringify(S), bootstrapFence).catch(() => {});
          } else writeSlotAndMain(slot, S);
          localStorage.removeItem(awaitingServerSlot(slot));
          syncFailed = false;
        }).catch(e => { if (stillCurrent()) handleSyncError(e); }).finally(() => {
          if (stillCurrent()) { if (localStorage.getItem(awaitingServerSlot(slot))) showAwaitingServer(); else home(); }
        });
      }
    } catch (_) {
      localSaveFailed = true;
      const raw = localStorage.getItem("vocab_v1");
      if (raw) { corruptStartup.push({key:"vocab_v1", raw}); boot(); }
      else { renderUserTag(); home(); }
    }
  } else if (localStorage.getItem("vocab_guest")) {
    try {
      const slot = "vocab_v1_guest", mainOwner = localStorage.getItem("vocab_v1_owner"), root = S;
      const loaded = loadSlot(slot);
      if (loaded === null) return;
      if (!loaded) S = mainOwner === slot ? root : defaultState();
      S = Object.assign(defaultState(), S); loadSlotClocks(slot); writeSlotAndMain(slot, S);
      localSaveFailed = false; home();
    } catch (_) {
      localSaveFailed = true;
      const raw = localStorage.getItem("vocab_v1");
      if (raw) { corruptStartup.push({key:"vocab_v1", raw}); boot(); }
      else { renderUserTag(); home(); }
    }
  } else {
    welcome();
  }
}

$("#dateStr").textContent = today();
boot();
