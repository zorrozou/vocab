  调度：FSRS-6（官方 py-fsrs · 保持率 90%）· 定级：CAT 自适应 · 例句：静态 + AI 个性化 · 语音：神经网络 TTS<br>

<script>
"use strict";
const API = "/vocab";
// 测试工具默认隐藏，仅 ?debug=1 显示，避免正式学习时误清进度/误快进
if (new URLSearchParams(location.search).get("debug") === "1") {
  document.getElementById("testTools").style.display = "";
}
const $ = s => document.querySelector(s);
/* "今天"用本地日期（UTC 日期会让 UTC+8 用户上午被错判成"昨天"，验收/streak/每日上限全按错日界走） */
const today = () => {
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
};
/* 词库等级名（词库按 level+frq 排序；区间重建后同步更新） */
const LVL_NAME = { 1: "入门高频", 2: "基础三千", 3: "四级", 4: "六级", 5: "雅思托福", 6: "万二高阶" };
const lvlOfPos = p => p <= 903 ? 1 : p <= 2652 ? 2 : p <= 4652 ? 3 : p <= 6152 ? 4 : p <= 9152 ? 5 : 6;
const lvlName = w => LVL_NAME[w.level || lvlOfPos(w.pos || 1)];
const addDays = (d, n) => { const t = new Date(d + "T12:00:00"); t.setDate(t.getDate() + n); return t.toISOString().slice(0, 10); };
const INTERVAL = { 1: 1, 2: 6, 3: 8, 4: 15, 5: 45 };

/* ---------------- 状态 ---------------- */
function defaultState() {
  return { v: 1, calibrated: false, frontier: 0, pointer: 1, probeCount: 0,
           posterior: null, pendingNew: [], track: null,
           cards: {}, log: [], personalized: {}, streak: 0, lastDay: null,
           settings: { newPerDay: 10, dailyCap: 100 } };
}
let S = Object.assign(defaultState(), JSON.parse(localStorage.getItem("vocab_v1") || "null") || {});
const save = () => {
  // 状态瘦身：日志只留最近 1200 条（不瘦身会超 nginx 64KB 限制导致推送静默 413——本次同步分歧的真凶）
  if (S.log.length > 1200) S.log = S.log.slice(-1200);
  localStorage.setItem("vocab_v1", JSON.stringify(S));
  localStorage.setItem("vocab_write_ts", String(Date.now() / 1000));   // 本机最新写入时刻（启动/登录比谁新用）
  if (AUTH) {
    clearTimeout(save._t);
    const owner = AUTH.userId, snapshot = JSON.parse(JSON.stringify(S));
    save._t = setTimeout(() => pushState(owner, snapshot), 2000);
  }   // 登录后防抖推送服务器；切号后旧任务不得写入新账号
};
let session = { queue: [], idx: 0, learnedToday: 0, reviewedToday: 0 };

/* ---------------- 语音（神经网络 TTS，浏览器兜底） ---------------- */
let audio = null;
let audioTimers = [];
let actx = null, activeSrcs = [];
function audioCtx() { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); return actx; }
document.addEventListener("pointerdown", () => { const c = audioCtx(); if (c.state === "suspended") c.resume(); }, { passive: true });
async function playText(text) {
  stopAudio();
  const my = ++seqToken;
  try {
    // 点击重听也走带重试的音频链路，服务器正在生成时不再“点了没反应”。
    const buf = await fetchBuf(text);
    if (my !== seqToken) return;
    const ctx = audioCtx();
    if (ctx.state === "suspended") await ctx.resume();
    const src = ctx.createBufferSource();
    src.buffer = buf; src.connect(ctx.destination);
    activeSrcs.push(src); src.start();
    logSentenceExposures(text, "audio", true);
  } catch (e) { if (my === seqToken) apHint(); }
}
function stopAudio() {
  if (audio) { audio.pause(); audio.currentTime = 0; audio = null; }
  audioTimers.forEach(clearTimeout); audioTimers = [];
  activeSrcs.forEach(s => { try { s.stop(); } catch (e) {} }); activeSrcs = [];
}
async function fetchBuf(text) {
  // 服务端可能正在生成音频（生成即产音频 + 双路兜底），失败时退避重试，不轻易放弃
  let lastErr = null;
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      const r = await fetch(`${API}/api/v1/tts?text=${encodeURIComponent(text)}&v=${encodeURIComponent(S.settings.voice || "")}`);
      if (!r.ok) throw new Error("tts " + r.status);
      const ab = await r.arrayBuffer();
      if (ab.byteLength < 500) throw new Error("audio too small");
      return await audioCtx().decodeAudioData(ab);
    } catch (e) {
      lastErr = e;
      if (attempt < 2) await new Promise(res => setTimeout(res, 800 * (attempt + 1)));
    }
  }
  throw lastErr;
}
/* 自动播放链（Web Audio 定时调度，绕开浏览器自动播放限制）：
   单词 → 停顿（=下一句时长）→ 例句1 → 停顿 → 例句2 → … */
let seqToken = 0;
async function autoPlaySequence(word, sentences) {
  stopAudio();
  const my = ++seqToken;
  const items = [word, ...(sentences || [])].filter(Boolean);
  if (!items.length) return;
  try {
    const ctx = audioCtx();
    if (ctx.state === "suspended") await ctx.resume();
    // 逐条容错：任何一条音频拉取失败只跳过该条（Promise.all 一处失败会作废整链——
    // 这就是"不少即时生成例句不能自动播放"的根因）
    const bufs = await Promise.all(items.map(t => fetchBuf(t).catch(() => null)));
    if (my !== seqToken) return;
    const ok = items.map((t, i) => ({ t, buf: bufs[i] })).filter(x => x.buf);
    if (!ok.length) { apHint(); return; }
    let t = ctx.currentTime + 0.05;
    ok.forEach((x, i) => {
      logSentenceExposures(x.t, "audio", true);   // 实际进入播放链才记 played=true
      const src = ctx.createBufferSource();
      src.buffer = x.buf; src.connect(ctx.destination);
      src.start(t);
      activeSrcs.push(src);
      t += x.buf.duration + (i < ok.length - 1 ? Math.max(0.6, (ok[i + 1].buf).duration) : 0);
    });
  } catch (e) {
    apHint();
    playText(items[0]);
  }
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function shadow(sentence, onResult) {
  const rec = new SR();
  rec.lang = "en-US"; rec.interimResults = false; rec.maxAlternatives = 1;
  rec.onresult = e => onResult({ text: e.results[0][0].transcript, confidence: e.results[0][0].confidence });
  rec.onerror = () => onResult(null);
  rec.start();
}
const tokens = t => (t.toLowerCase().match(/[a-z']+/g) || []).map(x => x.replace(/^'+|'+$/g, ""));

/* ---------------- 调度（FSRS-6 · 服务端官方 py-fsrs 计算，阶梯回退） ---------------- */
const tomorrow = () => addDays(today(), 1);
const LEGACY_STAB = { 1: 1, 2: 6, 3: 8, 4: 15, 5: 45 };  // 旧阶梯卡迁移映射

async function fsrsCall(body) {
  try {
    const resp = await fetch(API + "/api/v1/fsrs/review", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
    });
    if (!resp.ok) return null;
    const r = await resp.json();
    return r && Number.isFinite(r.stability) && Number.isFinite(r.difficulty) && r.due ? r : null;
  } catch (e) { return null; }
}
const fsrsDue = d => !d ? null : (d.length === 10 ? d + "T12:00:00Z" : d);
function ladderFallback(c, rating) {  // 端点不可用时的本地兜底
  const INTERVAL = { 1: 1, 2: 6, 3: 8, 4: 15, 5: 45 };
  if (rating === 1) { c.stage = Math.max(1, (c.stage || 1) - 1); c.due = tomorrow(); c.lt = 0; return; }
  const mult = rating === 2 ? 0.6 : rating === 4 ? 1.5 : 1;
  c.stage = Math.min(5, (c.stage || 1) + 1);
  c.due = addDays(today(), Math.max(1, Math.round(INTERVAL[c.stage] * mult)));
}

/* 该词上一次学习/复习日期（从日志推导，含历史老卡）：FSRS 必须知道真实经过天数，
   否则稳定度不增长（2026-10-26 实测发现的 P0） */
function lastReviewDate(word) {
  const l = [...S.log].reverse().find(x => x.word === word && (x.kind === "learn" || x.kind === "review"));
  return l ? l.d : null;
}

async function learn(word, pos, rating = 3, fromPending = false) {
  let c = S.cards[word];
  const isNewCard = !c;
  const lastReview = lastReviewDate(word);
  if (!c) c = S.cards[word] = { stage: 1, due: tomorrow(), lt: 0, pos };
  const body = c.fsrs
    ? { state: c.fsrs.state, stability: c.fsrs.stability, difficulty: c.fsrs.difficulty, due: c.fsrs.due, rating, step: c.fsrs.step, last_review: c.fsrs.lastReview || (lastReview ? lastReview + "T08:00:00Z" : null) }
    : isNewCard
      ? { is_new: true, rating }
      : { state: 2, stability: LEGACY_STAB[c.stage] || 1, difficulty: 5, due: fsrsDue(c.due), rating, last_review: lastReview ? lastReview + "T08:00:00Z" : null };
  const r = await fsrsCall(body);
  if (r) { c.fsrs = r; c.due = r.due || new Date(addDays(today(), 1) + "T08:00:00").toISOString(); delete c.stage; }
  else ladderFallback(c, rating);
  // 完成学习才消耗待补学词/推进顺序游标；待补学词的位置不能改写主学习进度。
  S.pendingNew = S.pendingNew.filter(w => w.word !== word);
  if (!fromPending) S.pointer = Math.max(S.pointer, pos + 1);
  S.log.push({ d: today(), word, rating, kind: "learn" });
  recordKnowledge(word, pos, rating !== 1);
  // 水平追踪观测（v1.2）：不熟悉=强证据；学会了=自评弱证据
  if (S.calibrated) posteriorUpdate(pos, rating === 1 ? 0 : 1, rating === 1 ? 1.0 : 0.5);
}

let undoSnapshot = null;
function undoReview() {
  if (!undoSnapshot) return;
  S.cards[undoSnapshot.word] = undoSnapshot.card;
  if (S.log.length > undoSnapshot.logCount) S.log.length = undoSnapshot.logCount;
  undoSnapshot = null;
  if (session.reviewedToday > 0) session.reviewedToday--;
  save();
}

async function review(word, rating, trackWeight) {
  const c = S.cards[word]; if (!c) return;
  const preStab = c.fsrs ? c.fsrs.stability : (LEGACY_STAB[c.stage] || 0);   // v1.3：成熟度用答前稳定度判断
  const lastReview = lastReviewDate(word);   // 在写今日日志前取上一次记录
  // 手滑误点「忘记」可撤销：评分前快照卡片与日志长度
  if (rating === 1) undoSnapshot = { word, card: JSON.parse(JSON.stringify(c)), logCount: S.log.length };
  else undoSnapshot = null;
  S.log.push({ d: today(), word, rating, kind: "review" });
  recordKnowledge(word, c.pos || S.pointer, rating !== 1);
  const body = c.fsrs
    ? { state: c.fsrs.state, stability: c.fsrs.stability, difficulty: c.fsrs.difficulty, due: c.fsrs.due, rating, step: c.fsrs.step, last_review: c.fsrs.lastReview || (lastReview ? lastReview + "T08:00:00Z" : null) }
    : { state: 2, stability: LEGACY_STAB[c.stage] || 1, difficulty: 5, due: fsrsDue(c.due), rating, last_review: lastReview ? lastReview + "T08:00:00Z" : null };
  const r = await fsrsCall(body);
  if (r) { c.fsrs = r; c.due = r.due || new Date(addDays(today(), 1) + "T08:00:00").toISOString(); if (rating === 1) c.lt = 0; delete c.stage; }
  else ladderFallback(c, rating);
  // 熟词毕业（用户反馈驱动）：连按两次「熟练」，或按「熟练」时稳定度已≥30天
  // → 直接跨过已掌握阈值（稳定度≥180），永不再出现。「记得/困难」照常走 FSRS。
  if (rating === 4) {
    c.easyStreak = (c.easyStreak || 0) + 1;
    if (c.easyStreak >= 2 || (c.fsrs && c.fsrs.stability >= 30)) {
      if (c.fsrs) c.fsrs.stability = Math.max(c.fsrs.stability, 200);
    }
  } else if (rating === 1) c.easyStreak = 0;
  // 水平追踪观测（v1.3 权重修正，治"只升不降"）：
  //  - 忘记：曾通过的成熟卡（答前稳定度≥21天）是有力向下证据 w0.4；新卡遗忘 w0.2
  //  - 记得/困难/熟练：只有词排位高于当前估值才算向上证据（低于估值的成功无信息量），w0.15
  //  - 被动证据每日总权重封顶 1.5，防复习量大的日子带偏估计；验收测试（trackWeight 1.0）不受上限
  const p = S.cards[word] && S.cards[word].pos;
  if (S.calibrated && p) {
    if (trackWeight !== undefined) {
      posteriorUpdate(p, rating === 1 ? 0 : 1, trackWeight, preStab >= 14 ? 0 : 0.25);
    } else {
      const tr = S.track || {};
      if (tr.dayWDay !== today()) { tr.dayW = 0; tr.dayWDay = today(); }
      let w = 0, resp = 1;
      if (rating === 1) { w = preStab >= 21 ? 0.4 : 0.2; resp = 0; }
      else if (p > postMean()) { w = 0.15; }
      if (w > 0 && (tr.dayW || 0) + w <= 1.5) {
        posteriorUpdate(p, resp, w, preStab >= 14 ? 0 : 0.25);
        tr.dayW = (tr.dayW || 0) + w;
        S.track = tr;
      }
    }
  }
}

const isMastered = c => c.stage === 6 || (c.fsrs && c.fsrs.stability >= 180);

/* ---------------- 定级（网格贝叶斯） ---------------- */
const GRID = []; for (let r = 0; r <= 12000; r += 250) GRID.push(r);
const logistic = x => 1 / (1 + Math.exp(-x));
/* v1.2：带权后验更新——weight<1 的弱证据按 like^w 缩放（tempering） */
/* v1.4：带猜测率的 3PL 似然。forward 4选1 猜测率 0.25；反向回想/自评为 0。
   防止"不会但猜对"被全部当成真实掌握而推高估值 */
function posteriorCalc(post, rank, resp, weight = 1.0, guess = 0) {
  const base = post || GRID.map(() => 1 / GRID.length);
  let sum = 0;
  const out = base.map((p, i) => {
    const pk = guess + (1 - guess) * logistic((GRID[i] - rank) / 400);
    const like = Math.pow(resp * pk + (1 - resp) * (1 - pk), weight);
    const v = p * like; sum += v; return v;
  });
  return out.map(v => v / sum);
}
function posteriorUpdate(rank, resp, weight = 1.0, guess = 0) {
  S.posterior = posteriorCalc(S.posterior, rank, resp, weight, guess);
  S.probeCount++;
}
const posteriorMean = post => post ? post.reduce((a, p, i) => a + GRID[i] * p, 0) : 0;
const posteriorStd = post => {
  if (!post) return 0;
  const m = posteriorMean(post);
  return Math.sqrt(post.reduce((a, p, i) => a + (GRID[i] - m) ** 2 * p, 0));
};
const postMean = () => posteriorMean(S.posterior);
const postStd = () => posteriorStd(S.posterior);

/* ---------------- v2.0 词级知识预测（HLR/BKT 思路） ----------------
   每个词/每个档位保留 a/b 证据；已学卡片用 FSRS 的 R(t)，未学词用档位先验。
   展示 ΣP(认识)，而不是把一次测试的点估值当成真实词汇量。 */
function bandIndexOfPos(pos) {
  for (let i = 0; i < PLACEMENT_BANDS.length; i++) {
    if (pos >= PLACEMENT_BANDS[i].lo && pos <= PLACEMENT_BANDS[i].hi) return i;
  }
  return PLACEMENT_BANDS.length - 1;
}

function bandPrior(i) {
  const st = S.bandStats && S.bandStats[i];
  if (st && st.a + st.b > 0) return st.a / (st.a + st.b);
  // 没有定级证据时用当前边界做弱先验，避免默认所有词都未知
  const center = (PLACEMENT_BANDS[i].lo + PLACEMENT_BANDS[i].hi) / 2;
  if (S.frontier) return Math.max(0.05, Math.min(0.95, logistic((S.frontier - center) / 400)));
  return 0.2;   // 没有定级证据时保持保守先验，避免默认每档都“会一半”导致预计认识词数虚高
}

function knowledgeProb(word, pos) {
  const c = S.cards[word];
  if (c && c.fsrs) {
    const last = c.fsrs.lastReview || lastReviewDate(word);
    const elapsed = last ? Math.max(0, (Date.now() - new Date(last + "T08:00:00Z").getTime()) / 86400000) : 0;
    return Math.pow(1 + 0.9805 * elapsed / Math.max(0.2, c.fsrs.stability), -0.1542);
  }
  const k = S.knowledge && S.knowledge[word];
  if (k && k.a + k.b > 0) return k.a / (k.a + k.b);
  return bandPrior(bandIndexOfPos(pos));
}

function expectedKnown() {
  let total = 0;
  const adjusted = new Set();
  for (let i = 0; i < PLACEMENT_BANDS.length; i++) {
    const b = PLACEMENT_BANDS[i];
    const size = b.hi - b.lo + 1;
    total += size * bandPrior(i);
  }
  // 有词级证据或卡片的词，用更准确的概率替换档位先验
  const words = new Set([...Object.keys(S.knowledge || {}), ...Object.keys(S.cards || {})]);
  words.forEach(w => {
    const pos = (S.cards[w] && S.cards[w].pos) || (S.knowledge[w] && S.knowledge[w].pos) || S.pointer;
    const idx = bandIndexOfPos(pos);
    const size = PLACEMENT_BANDS[idx].hi - PLACEMENT_BANDS[idx].lo + 1;
    total += knowledgeProb(w, pos) - bandPrior(idx);
    adjusted.add(w);
  });
  return Math.max(0, Math.round(total));
}

function placementPointer() {
  for (let i = 0; i < PLACEMENT_BANDS.length; i++) {
    const b = PLACEMENT_BANDS[i];
    const p = bandPrior(i);
    if (p < 0.75) {
      return Math.max(b.lo, Math.min(b.hi, b.lo + Math.floor((b.hi - b.lo + 1) * p)));
    }
  }
  return PLACEMENT_BANDS[PLACEMENT_BANDS.length - 1].hi - 50;
}

function recordKnowledge(word, pos, ok, isPlacement = false) {
  if (!S.knowledge) S.knowledge = {};
  const k = S.knowledge[word] || { a: 0, b: 0, pos };
  if (ok) k.a++; else k.b++;
  k.pos = pos;
  S.knowledge[word] = k;
  if (isPlacement) {
    const i = bandIndexOfPos(pos);
    if (!S.bandStats) S.bandStats = {};
    const st = S.bandStats[i] || { a: 0, b: 0 };
    if (ok) st.a++; else st.b++;
    S.bandStats[i] = st;
  }
}
const converged = () => (postStd() < 500 && S.probeCount >= 12) || S.probeCount >= 40;

/* ---------------- v1.3 置信度扩散：水平会漂移，系统保持"可被说服" ---------------- */
/* 每天一次，后验与 σ=100 的高斯核卷积（借鉴 Glicko 的 RD 增长）：均值不变、std 缓慢回升，
   防止收敛后的后验"自信到动不了"，让探测证据始终能产生影响 */
function diffusePosterior() {
  if (!S.posterior) return;
  if (postStd() >= 400) return;   // 不确定度封顶：够模糊就不再扩散
  const k = Math.exp(-(250 * 250) / (2 * 100 * 100));   // 网格步长 250 的邻位权重 ≈0.0439
  const p = S.posterior, n = p.length, out = new Array(n);
  for (let i = 0; i < n; i++) out[i] = p[i] + k * ((i > 0 ? p[i-1] : 0) + (i < n - 1 ? p[i+1] : 0));
  const sum = out.reduce((a, b) => a + b, 0);
  S.posterior = out.map(v => v / sum);
}

/* ---------------- v1.2/v1.3 自适应水平追踪：每日一次评估与重规划 ---------------- */
function trackLevelDaily() {
  if (!S.calibrated || !S.posterior) return;
  if (S.track && S.track.evalDay === today()) return;   // 每日最多一次
  const track = S.track || {};
  // v1.3：先做置信度扩散（每日一次），再评估
  if (track.diffuseDay !== today()) { diffusePosterior(); track.diffuseDay = today(); }
  const T = Math.round(postMean()), std = postStd();
  if (T - S.pointer > 500 && std < 800) {
    track.lastNote = `连续表现超过当前级别，发词位置从 ${S.pointer} 追平到 ≈${T}（${LVL_NAME[lvlOfPos(T)]}），中间词视为已会跳过`;
    S.pointer = T;
    track.lowSince = null; track.throttle = false;
  } else if (S.pointer - T > 500) {
    if (!track.lowSince) track.lowSince = today();
    if (track.lowSince <= addDays(today(), -1) && !track.throttle) {
      track.throttle = true;
      track.lastNote = `近期新词偏难（水平估值 ≈${T}，游标 ${S.pointer}），新词临时降到 5 个/天，先消化存量`;
    }
  } else {
    if (track.throttle) track.lastNote = `水平追上来了（≈${T}），新词恢复 ${S.settings.newPerDay} 个/天`;
    track.lowSince = null; track.throttle = false;
  }
  // v1.3 级别滞回：后验均值跨边界须连续 3 天，才正式调整展示级别（防单日抖动）
  const band = lvlOfPos(Math.max(1, T));
  if (!track.shownLevel) track.shownLevel = lvlOfPos(Math.max(1, S.pointer));
  if (band !== track.shownLevel) {
    if (track.pendingBand === band) track.pendingDays = (track.pendingDays || 0) + 1;
    else { track.pendingBand = band; track.pendingDays = 1; }
    if (track.pendingDays >= 3) {
      track.shownLevel = band;
      track.lastNote = `词汇水平连续 3 天稳定在「${LVL_NAME[band]}」区间，当前级别已调整`;
      track.pendingBand = null; track.pendingDays = 0;
    }
  } else { track.pendingBand = null; track.pendingDays = 0; }
  track.evalDay = today();
  S.track = track;
  save();
}

/* v1.3 主动探测选词：上方近端 / 上方远端 / 下方回归检查 各 1 个 */
async function pickProbes(reviewsAll, news) {
  if (!S.calibrated || !S.posterior) return [];
  // 每日总计 3 题：当天重建队列（继续复习/二次进入）不重复追加探测
  const already = S.log.filter(l => l.kind === "probe" && l.d === today()).length;
  const need = 3 - already;
  if (need <= 0) return [];
  const m = postMean(), sd = Math.max(60, postStd());
  const recentProbe = new Set(S.log.filter(l => l.kind === "probe" && l.d >= addDays(today(), -14)).map(l => l.word));
  const busy = new Set([...reviewsAll, ...news.map(w => w.word)]);
  const zones = [
    [m + 0.5 * sd, m + 1.0 * sd, true],   // 上方近端：反向回想，检验是否真会而非眼熟
    [m + 1.5 * sd, m + 2.0 * sd, false],  // 上方远端：正向再认，探大幅进步
    [m - 1.0 * sd, m - 0.5 * sd, false],  // 下方：正向再认，高估回归检查
  ];
  const out = [];
  for (const [lo, hi, reverse] of zones) {
    if (out.length >= need) break;
    const a = Math.max(1, Math.round(lo)), b = Math.min(10991, Math.round(hi));
    if (a > b) continue;
    for (let tries = 0; tries < 6; tries++) {
      const pos = a + Math.floor(Math.random() * (b - a + 1));
      try {
        const r = await fetch(`${API}/api/v1/lexicon/at?pos=${pos}&n=1`).then(r => r.json());
        const w = r.words && r.words[0];
        if (w && !S.cards[w.word] && !recentProbe.has(w.word) && !busy.has(w.word)
            && !out.find(x => x.word === w.word) && !S.pendingNew.find(x => x.word === w.word)) {
          out.push({ ...w, reverse }); break;
        }
      } catch (e) {}
    }
  }
  return out;
}

/* ---------------- 队列 ---------------- */
async function buildQueue() {
  const due = Object.entries(S.cards)
    .filter(([w, c]) => !isMastered(c) && new Date(c.due) <= new Date())
    .sort((a, b) => a[1].due < b[1].due ? -1 : 1)
    .map(([w]) => w);
  const reviews = due.slice(0, S.settings.dailyCap);
  // 提前巩固位：刚学会（≤7天）、FSRS 未到期、未掌握的词，按 P=(1−R)×0.5 概率抽取（≤5个）
  const nowD = new Date();
  const earlyPool = Object.entries(S.cards).filter(([w, c]) => {
    if (isMastered(c) || new Date(c.due) <= nowD) return false;
    const last = [...S.log].reverse().find(l => l.word === w);
    if (!last) return false;
    const elapsed = (nowD - new Date(last.d + "T12:00:00")) / 86400000;
    if (elapsed > 7 || elapsed < 1) return false;   // 昨天刚过的才进入概率池
    const S0 = c.fsrs ? Math.max(0.2, c.fsrs.stability) : 2;
    const R = Math.pow(1 + 0.9805 * elapsed / S0, -0.1542);
    return Math.random() < (1 - R) * 0.5;
  }).map(([w]) => w);
  const early = earlyPool.filter(w => !reviews.includes(w))
    .slice(0, Math.min(5, Math.max(0, S.settings.dailyCap - reviews.length)));
  const reviewsAll = [...reviews, ...early];
  trackLevelDaily();   // v1.2：水平追踪每日一次（可能跳位/减压）
  const nNew = Math.min(S.track && S.track.throttle ? 5 : S.settings.newPerDay, Math.max(0, S.settings.dailyCap - reviewsAll.length));
  const news = [];
  // 只清理已入卡项；选中但未学完的词继续保留，退出重进不会丢词。
  S.pendingNew = S.pendingNew.filter(w => !S.cards[w.word]);
  for (const w of S.pendingNew) {
    if (news.length >= nNew) break;
    if (!news.find(x => x.word === w.word)) news.push({ ...w, fromPending: true });
  }
  if (news.length < nNew) {
    const resp = await fetch(`${API}/api/v1/lexicon/at?pos=${S.pointer}&n=${nNew - news.length + 2}`);
    if (!resp.ok) throw new Error("词条加载失败");
    const r = await resp.json();
    for (const w of r.words) {
      if (news.length >= nNew) break;
      if (!S.cards[w.word] && !news.find(x => x.word === w.word)) news.push(w);
    }
  }
  // 统一按词形补全详情，避免位置漂移造成空释义或错词释义。
  for (const w of news) {
    if (!w.senses || !w.senses.length) {
      try {
        const resp = await fetch(`${API}/api/v1/lexicon/word?word=${encodeURIComponent(w.word)}`);
        if (!resp.ok) continue;
        const full = await resp.json(), pending = w.fromPending;
        Object.assign(w, full);
        w.fromPending = pending;
      } catch (e) {}
    }
  }
  // v1.3 每日主动探测：3 个探测词（2 个后验上方区 / 1 个下方区）随机混入复习段，
  // 4选1 形式与复习测验无差别——用户无感知，证据全额（与定级同级 weight 1.0）
  const probes = await pickProbes(reviewsAll, news);
  const revBlock = reviewsAll.map(w => ({ kind: "review", word: w }));
  for (const w of probes) {
    const at = Math.floor(Math.random() * (revBlock.length + 1));
    revBlock.splice(at, 0, { kind: "probe", word: w.word, detail: w });
  }
  session.queue = [
    ...revBlock,
    ...news.map(w => ({ kind: "learn", word: w.word, detail: w }))
  ];
  session.idx = 0;
  save();
  prefetchDay(news, reviewsAll);
}

/* 队列确定后立即后台预生成：例句三句套装 + TTS 音频预热，不等翻卡 */
function prefetchDay(news, reviewWords) {
  const weak = [...new Set(S.log.filter(l => l.rating <= 2 && l.d >= addDays(today(), -7)).map(l => l.word))].slice(0, 15).join(",");
  const jobs = news.map(w =>
    fetch(`${API}/api/v1/sentence/trio?word=${encodeURIComponent(w.word)}&weak=${encodeURIComponent(weak)}&cap=${S.pointer + 10}`)
      .then(r => r.json())
      .then(r => { if (r.sentences && r.sentences.length) w.sentences = r.sentences; })
      .catch(() => {})
  );
  Promise.all(jobs).then(() => {
    const texts = [];
    news.forEach(w => { texts.push(w.word); (w.sentences || []).forEach(s => texts.push(s.text)); });
    reviewWords.slice(0, 15).forEach(w => texts.push(w));
    texts.slice(0, 80).forEach(t => fetch(`${API}/api/v1/tts?text=${encodeURIComponent(t)}&v=${encodeURIComponent(S.settings.voice || "")}`).catch(() => {}));
  });
}

/* ---- 定级流程（固定分层 30 题：6 个词汇量区间各随机 5 题） ----
   每个区间独立评估，找到第一个不扎实的区间；答完全部 30 题再定边界，
   不再让前几题答对就直接跳到高级别。 */
const PLACEMENT_BANDS = [
  { lo: 1, hi: 2000 }, { lo: 2001, hi: 4000 }, { lo: 4001, hi: 6000 },
  { lo: 6001, hi: 8000 }, { lo: 8001, hi: 10000 }, { lo: 10001, hi: 10987 }
];
let placePositions = [];
let placeAnswers = [];

function makePlacementPositions() {
  const out = [];
  for (const b of PLACEMENT_BANDS) {
    const used = new Set();
    while (used.size < 2) used.add(b.lo + Math.floor(Math.random() * (b.hi - b.lo + 1)));
    used.forEach(p => out.push(p));
  }
  return out;
}

function catFinalMean() {
  const a = catMeans.slice(-5).sort((x, y) => x - y);
  return a.length ? Math.round(a[Math.floor(a.length / 2)]) : Math.max(1, Math.round(postMean()));
}
let catMeans = [];

function placementEstimate() {
  let estimate = PLACEMENT_BANDS[0].lo;
  for (let i = 0; i < PLACEMENT_BANDS.length; i++) {
    const b = PLACEMENT_BANDS[i];
    const score = placeAnswers.slice(i * 5, i * 5 + 5).filter(Boolean).length;
    if (score < 3) break;   // 低于60%：该区间不扎实，停在最后通过区间的估值
    estimate = Math.min(b.hi, b.lo + Math.round((b.hi - b.lo) * (score - 1) / 5));
  }
  return estimate;
}

function posteriorAround(mean, sd = 500) {
  const raw = GRID.map(g => Math.exp(-((g - mean) ** 2) / (2 * sd * sd)));
  const sum = raw.reduce((a, b) => a + b, 0);
  return raw.map(v => v / sum);
}

function placementScoreText() {
  return PLACEMENT_BANDS.map((b, i) => {
    const score = placeAnswers.slice(i * 2, i * 2 + 2).filter(Boolean).length;
    return `${b.lo}~${b.hi}：${score}/2`;
  }).join("　");
}

async function place() {
  if (S.probeCount === 0 && !S.posterior) {
    placePositions = makePlacementPositions();
    placeAnswers = [];
    catMeans = [];
  }
  if (S.probeCount >= 30) { finishPlace(catFinalMean()); return; }
  // 前 12 题每档 2 题覆盖全部级别；后 18 题在当前估计边界附近集中探测
  const pos = S.probeCount < placePositions.length
    ? placePositions[S.probeCount]
    : Math.min(Math.max(Math.round(postMean()) + Math.floor(Math.random() * 301) - 150, 1), 10987);
  let w = null;
  for (let k = 0; k < 3; k++) {
    try { w = await fetch(`${API}/api/v1/quiz?pos=${pos}&seed=${Date.now() % 99991}`).then(r => r.json()); } catch (e) {}
    if (w && w.options && w.options.length >= 4) break;
    w = null;
  }
  if (!w) {
    $("#app").innerHTML = `<div class="card center"><p class="muted">网络异常，请重试</p><div class="row"><button class="act" onclick="place()">重试</button></div></div>`;
    return;
  }
  renderChips();
  const band = PLACEMENT_BANDS.findIndex(b => w.pos >= b.lo && w.pos <= b.hi) + 1;
  $("#app").innerHTML = `<div class="card center">
    <h2>智能定级 · 第 ${S.probeCount + 1}/30 题 · 第 ${band} 区间</h2>
    <div><span class="big">${w.word}</span><button class="playw" data-t="${w.word}">▶</button></div>
    <div style="text-align:left;margin-top:10px">${w.options.map((o, i) => `<button class="opt" data-i="${i}">${o.text}</button>`).join("")}</div>
    <div class="row" style="margin-top:10px"><button class="act ghost" id="bUnknown">不认识</button></div>
    <div class="progress"><i style="width:${S.probeCount / 30 * 100}%"></i></div>
    <p class="muted" style="margin-top:10px">不确定请点「不认识」，不要猜</p>
  </div>`;
  bindPlays();
  playText(w.word);
  const answer = (ok, guessed, btn) => {
    document.querySelectorAll(".opt").forEach(x => {
      x.disabled = true;
      if (w.options[+x.dataset.i].ok) x.classList.add("right");
    });
    $("#bUnknown").disabled = true;
    if (!ok && guessed && btn) btn.classList.add("wrong");
    placeAnswers[S.probeCount] = ok;
    recordKnowledge(w.word, w.pos, ok, true);
    posteriorUpdate(w.pos, ok ? 1 : 0, 1.0, guessed ? 0.25 : 0);
    catMeans.push(Math.round(postMean()));
    S.log.push({ d: today(), word: w.word, rating: ok ? 4 : 1, kind: "placement" });
    if (!ok && !S.pendingNew.find(x => x.word === w.word)) S.pendingNew.push(w);
    setTimeout(() => { save(); place(); }, 450);
  };
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(w.options[+b.dataset.i].ok, true, b));
  $("#bUnknown").onclick = () => answer(false, false, null);
}

function finishPlace(r) {
  S.calibrated = true;
  S.frontier = placementPointer();
  S.pointer = S.frontier;
  // 保留 30 题形成的后验供每日追踪，不用单点估值重置它
  save();
  $("#app").innerHTML = `<div class="card center">
    <h2>定级完成</h2>
    <div class="score">预计认识 ${expectedKnown()} 词</div>
    <p class="muted">当前级别：${LVL_NAME[lvlOfPos(S.frontier)]} · 发词位置 ${S.frontier}<br>${placementScoreText()}<br>新词将从这个位置开始，${S.pendingNew.length} 个答错词会优先补学</p>
    <div class="row"><button class="act" id="bGo">开始学习</button></div>
  </div>`;
  renderChips();
  $("#bGo").onclick = home;
}

/* ---- 学习卡 ---- */
function step() {
  stopAudio();
  if (session.idx >= session.queue.length) return maybeQuiz();
  const item = session.queue[session.idx];
  if (item.kind === "learn") showLearn(item);
  else if (item.kind === "probe") showProbe(item);
  else showReview(item);
}

/* ---- v1.3 探测题：与复习测验同形态（4选1），用户无感知；答错进明日新词候选 ---- */
async function showProbe(item) {
  const w = item.detail, pos = w.pos || S.pointer;
  let quiz = null;
  try { quiz = await fetch(`${API}/api/v1/quiz?pos=${pos}&seed=${Date.now() % 99991}&mode=${w.reverse ? "reverse" : "forward"}`).then(r => r.json()); } catch (e) {}
  if (!quiz || !quiz.options || quiz.options.length < 4) {   // 出题失败直接跳过，不影响主流程
    session.idx++; save(); return step();
  }
  const isRev = w.reverse && quiz.mode === "reverse" && quiz.prompt;
  $("#app").innerHTML = `<div class="card center">
    <h2>复习 ${session.idx + 1}/${session.queue.length}</h2>
    ${isRev
      ? `<div><span class="big" style="font-size:30px">${quiz.prompt}</span></div><p class="muted" style="margin:10px 0 4px">回想它的英文单词：</p>`
      : `<div><span class="big">${w.word}</span><button class="playw" data-t="${w.word}">▶</button></div><p class="muted" style="margin:10px 0 4px">选出正确词义：</p>`}
    <div style="text-align:left">${quiz.options.map((o, i) => `<button class="opt" data-i="${i}">${o.text}</button>`).join("")}</div>
    <div class="progress"><i style="width:${session.idx / session.queue.length * 100}%"></i></div>
  </div>`;
  bindPlays();
  if (!isRev) playText(w.word);   // 反向回想不放音，避免泄题
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const ok = quiz.options[+b.dataset.i].ok;
    document.querySelectorAll(".opt").forEach(x => {
      x.disabled = true;
      if (quiz.options[+x.dataset.i].ok) x.classList.add("right");
    });
    if (!ok) b.classList.add("wrong");
    answerProbe(w, ok);
    setTimeout(() => { session.idx++; save(); step(); }, 650);
  });
}

/* v1.4 探测作答：全额证据；正向猜测率 0.25，反向回想为 0；答错 → 进明日新词候选 */
function answerProbe(w, ok) {
  posteriorUpdate(w.pos || S.pointer, ok ? 1 : 0, 1.0, w.reverse ? 0 : 0.25);
  S.log.push({ d: today(), word: w.word, rating: ok ? 4 : 1, kind: "probe", reverse: !!w.reverse });
  if (!ok && !S.cards[w.word] && !S.pendingNew.find(x => x.word === w.word)) {
    S.pendingNew.push({ word: w.word, pos: w.pos });
  }
}

/* ---- 当日新词验收测试（4选1） ---- */
function maybeQuiz() {
  const learnedToday = [...new Set(S.log.filter(l => l.d === today() && l.kind === "learn").map(l => l.word))];
  if (!learnedToday.length || S.quizDay === today()) return doneDay();
  quizRound(learnedToday, 0);
}

async function quizRound(words, i) {
  if (i >= words.length) { S.quizDay = today(); save(); return doneDay(); }
  const w = words[i];
  const pos = S.cards[w] ? S.cards[w].pos : 1200;
  let q = null;
  try { q = await fetch(`${API}/api/v1/quiz?pos=${pos}&seed=${Date.now() % 99991}`).then(r => r.json()); } catch (e) {}
  if (!q || !q.options || q.options.length < 4) return quizRound(words, i + 1);
  $("#app").innerHTML = `<div class="card center">
    <h2>验收测试 ${i + 1}/${words.length} · 今天学的还记得吗？</h2>
    <div><span class="big">${w}</span><button class="playw" data-t="${w}">▶</button></div>
    <div style="text-align:left;margin-top:10px">${q.options.map((o, k) => `<button class="opt" data-i="${k}">${o.text}</button>`).join("")}</div>
    <div class="progress"><i style="width:${i / words.length * 100}%"></i></div>
    <p class="muted" style="margin-top:10px">答对 → 明天复习见 · 答错 → 进入薄弱词，今晚就定制例句</p>
  </div>`;
  bindPlays();
  playText(w);
  document.querySelectorAll(".opt").forEach(b => b.onclick = async () => {
    const ok = q.options[+b.dataset.i].ok;
    document.querySelectorAll(".opt").forEach(x => {
      x.disabled = true;
      if (q.options[+x.dataset.i].ok) x.classList.add("right");
    });
    if (!ok) b.classList.add("wrong");
    await review(w, ok ? 3 : 1, 1.0);   // 验收是客观实测：权重 1.0（强于复习的 0.2/0.3）
    setTimeout(() => quizRound(words, i + 1), 650);
  });
}

async function wordDetail(word, pos) {
  try {
    const resp = await fetch(`${API}/api/v1/lexicon/word?word=${encodeURIComponent(word)}`);
    if (resp.ok) return await resp.json();
  } catch (e) {}
  return { word, pos, senses: [], sentences: [], loadError: true };
}

/* 例句曝光埋点：用于后续评估"薄弱词复现 → 3/7/30 天记忆效果" */
function sentenceHash(text) {
  let h = 2166136261;
  for (const b of new TextEncoder().encode(text)) h = Math.imul(h ^ b, 16777619) >>> 0;
  return h.toString(16);
}
function logExposure(word, source, text, played = false, score = null) {
  if (!word) return;
  S.log.push({ d: today(), ts: new Date().toISOString(), word, rating: 3, kind: "exposure",
               source, sentenceId: sentenceHash(text), played, ...(score === null ? {} : { score }) });
}
function logSentenceExposures(text, source, played = false) {
  if (!text) return;
  const weak = [...new Set(S.log.filter(l => l.rating <= 2 && l.d >= addDays(today(), -7)).map(l => l.word))];
  const lower = text.toLowerCase();
  for (const w of weak) {
    const esc = w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    if (new RegExp(`\\b${esc}\\b`, "i").test(lower)) logExposure(w, source, text, played);
  }
}

function sentenceBlock(word, personal, sents) {
  if (S.cards[word] && isMastered(S.cards[word])) personal = null;   // 已掌握词不再显示旧个性化例句
  const TIER = { 1: "基础", 2: "进阶", 3: "挑战" };
  const list = Array.isArray(sents) ? sents : (sents ? [{ tier: 1, text: sents }] : []);
  let html = "";
  if (personal) html += `<div class="sent"><span class="tag p">个性化</span>${personal.text}<button class="plays" data-t="${personal.text}">▶</button><button class="plays bad" data-t="${personal.text}" data-w="${word}" data-kind="personal" title="换一句">↻</button>${personal.zh ? `<div class="zh">${personal.zh}</div>` : ""}</div>`;
  list.forEach(s => {
    html += `<div class="sent"><span class="tag s">${TIER[s.tier] || "例句"}</span>${s.text}<button class="plays" data-t="${s.text}">▶</button><button class="plays bad" data-t="${s.text}" data-w="${word}" data-kind="static" title="换一句">↻</button>${s.zh ? `<div class="zh">${s.zh}</div>` : ""}</div>`;
  });
  if (!html) html = `<div class="sent" id="pendingSent"><span class="tag s">例句</span><span class="muted">生成中…</span></div>`;
  if (personal) logSentenceExposures(personal.text, "personal", false);
  list.forEach(s => logSentenceExposures(s.text, "trio", false));
  return { html, has: !!(personal || list.length), first: personal ? personal.text : (list[0] ? list[0].text : ""),
           texts: [...(personal ? [personal.text] : []), ...list.map(s => s.text)] };
}

function isCurrentLearn(word) {
  const cur = session.queue[session.idx];
  return cur && cur.kind === "learn" && cur.word === word;
}

async function showLearn(item) {
  let w = item.detail;
  if (!w.senses || !w.senses.length) {
    const full = await wordDetail(w.word, w.pos);
    if (!full.loadError) { full.fromPending = w.fromPending; w = full; item.detail = full; }
  }
  const personal = S.personalized[w.word];
  const sents = w.sentences || (w.static ? [{ tier: 1, text: w.static }] : []);
  const sb = sentenceBlock(w.word, personal, sents);
  const senseHtml = (w.senses || []).map(s => `<span><i>${s.pos || "·"}</i>${s.text}</span>`).join("")
    || (w.sense ? `<span>${w.sense}</span>` : `<span class="muted">词义加载失败，请检查网络</span><button class="ghost" id="bRetrySense">重新加载</button>`);
  $("#app").innerHTML = `<div class="card">
    <h2>新词 ${session.idx + 1}/${session.queue.length} · ${lvlName(w)}</h2>
    <div><span class="big">${w.word}</span><button class="playw" data-t="${w.word}">▶</button></div>
    <div class="phon">${w.phonetic ? "/" + w.phonetic + "/" : ""}</div>
    <div class="sense">${senseHtml}</div>
    ${sb.html}
    <div class="row">
      ${SR ? `<button class="icon" id="bShadow">🎤 跟读</button>` : ""}
      <button class="act warn" id="bWeak">不熟悉</button>
      <button class="act ok" id="bNext">学会了 →</button>
    </div>
    <div class="progress"><i style="width:${session.idx / session.queue.length * 100}%"></i></div>
    <div class="muted" id="shadowOut" style="margin-top:8px"></div>
  </div>`;
  bindPlays();
  if ($("#bRetrySense")) $("#bRetrySense").onclick = () => showLearn(item);
  const sentence = sb.first;
  autoPlaySequence(w.word, sb.texts);
  if (SR) $("#bShadow").onclick = () => {
    const target = sentence || window.__pendingSent || "";
    if (!target) { $("#shadowOut").textContent = "例句还在生成，稍等"; return; }
    $("#shadowOut").textContent = "请朗读例句…";
    shadow(target, res => {
      if (!res || !isCurrentLearn(w.word)) return;
      const exp = tokens(target), got = new Set(tokens(res.text));
      const hit = exp.filter(t => got.has(t)).length;
      const pct = Math.round(hit / exp.length * 100);
      logExposure(w.word, "shadow", target, true, pct);
      const conf = Math.round((res.confidence || 0.7) * 100);
      $("#shadowOut").innerHTML = `识别：${res.text}<br>完整度 <span class="${pct >= 80 ? "hl" : "rec"}" style="font-size:18px;font-weight:700">${pct}%</span> · 置信度 <span class="${conf >= 75 ? "hl" : "rec"}" style="font-size:18px;font-weight:700">${conf}%</span>`;
    });
  };
  let acted = false;
  const act = async rating => {
    if (acted) return;
    acted = true;
    $("#bWeak").disabled = true; $("#bNext").disabled = true;
    await learn(w.word, w.pos, rating, w.fromPending === true);
    session.learnedToday++; session.idx++; save(); step();
  };
  $("#bWeak").onclick = () => act(1);
  $("#bNext").onclick = () => act(3);
  if (!personal && sents.length < 3) {
    const weak = [...new Set(S.log.filter(l => l.rating <= 2 && l.d >= addDays(today(), -7)).map(l => l.word))].slice(0, 15).join(",");
    fetch(`${API}/api/v1/sentence/trio?word=${encodeURIComponent(w.word)}&weak=${encodeURIComponent(weak)}&cap=${S.pointer + 10}`)
      .then(r => r.json()).then(r => {
        if (!isCurrentLearn(w.word) || !r.sentences || !r.sentences.length) return;
        w.sentences = r.sentences;
        const newSb = sentenceBlock(w.word, personal, r.sentences);
        document.querySelectorAll("#app .sent").forEach(e => e.remove());
        const anchor = document.querySelector("#app .sense");
        if (anchor) anchor.insertAdjacentHTML("afterend", newSb.html.replace('id="pendingSent"', ""));
        bindPlays();
        if (!sb.first && newSb.texts.length) autoPlaySequence(w.word, newSb.texts);
      }).catch(() => {});
  }
  // 巩固句：新词例句 40% 概率织入近期薄弱词（每天 ≤3 次，先查句库共现再生成）
  const wk = today();
  if (S.weaveDay !== wk) { S.weaveDay = wk; S.weaveCount = 0; }
  const weakPool = [...new Set(S.log.filter(l => l.rating <= 2 && l.d >= addDays(today(), -7)).map(l => l.word))]
    .filter(x => x !== w.word && !(S.cards[x] && isMastered(S.cards[x])));
  if (!personal && weakPool.length && S.weaveCount < 3 && Math.random() < 0.4) {
    const weakW = weakPool[Math.floor(Math.random() * weakPool.length)];
    S.weaveCount++; save();
    fetch(`${API}/api/v1/sentence/weave?word=${encodeURIComponent(w.word)}&weak=${encodeURIComponent(weakW)}&cap=${S.pointer + 10}&device=${deviceId()}`)
      .then(r => r.json()).then(r => {
        if (!isCurrentLearn(w.word) || !r.text) return;
        logExposure(weakW, "weave", r.text, false);
        const anchor = document.querySelector("#app .sense");
        if (!anchor) return;
        anchor.insertAdjacentHTML("afterend",
          `<div class="sent"><span class="tag" style="color:#5f9cec;border:1px solid #2a4a6e">巩固</span>${r.text}<button class="plays" data-t="${r.text}">▶</button><button class="plays bad" data-t="${r.text}" data-w="${w.word}" data-kind="weave" title="换一句">↻</button> <span class="zh">（复习词：${weakW}）</span>${r.zh ? `<div class="zh">${r.zh}</div>` : ""}</div>`);
        bindPlays();
      }).catch(() => {});
  }
}

function bindPlays() {
  document.querySelectorAll(".plays,.playw").forEach(b => {
    b.onclick = ev => { ev.stopPropagation(); playText(b.dataset.t); };
  });
  // ↻ 换一句：上报/移除并重生（用户无需判断好坏，纯偏好操作）
  document.querySelectorAll(".bad").forEach(b => {
    b.onclick = async ev => {
      ev.stopPropagation();
      const w = b.dataset.w, kind = b.dataset.kind, text = b.dataset.t;
      const sentEl = b.closest(".sent");
      if (sentEl) sentEl.style.opacity = ".35";
      try {
        if (kind !== "static") { delete S.personalized[w]; save(); }
        else { await fetch(`${API}/api/v1/sentence/report?word=${encodeURIComponent(w)}&text=${encodeURIComponent(text)}`, { method: "POST" }); }
      } catch (e) {}
      try {
        if (kind === "static") {
          // 触发补档并重取该词条
          await fetch(`${API}/api/v1/sentence/trio?word=${encodeURIComponent(w)}&cap=${S.pointer + 10}`).then(r => r.json());
          const pos = (S.cards[w] && S.cards[w].pos) || S.pointer;
          const r2 = await fetch(`${API}/api/v1/lexicon/at?pos=${pos}&n=20`).then(r => r.json());
          const wd = r2.words.find(x => x.word === w);
          const fresh = wd && (wd.sentences || []).find(x => x.text !== text);
          if (fresh && sentEl) {
            const TIER = { 1: "基础", 2: "进阶", 3: "挑战" };
            sentEl.outerHTML = `<div class="sent"><span class="tag s">${TIER[fresh.tier] || "例句"}</span>${fresh.text}<button class="plays" data-t="${fresh.text}">▶</button><button class="plays bad" data-t="${fresh.text}" data-w="${w}" data-kind="static" title="换一句">↻</button>${fresh.zh ? `<div class="zh">${fresh.zh}</div>` : ""}</div>`;
            bindPlays();
          } else if (sentEl) sentEl.remove();
        } else {
          // 个性化/巩固句：单条重生（replace=false 追加，不清批次）
          await fetch(API + "/api/v1/personalize", { method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ device: deviceId(), date: today(), new_words: [], weak_words: [w], learned_max_pos: S.pointer + 10, sync: true }) });
          const p = await fetch(`${API}/api/v1/personalized?device=${deviceId()}&date=${today()}`, { headers: authHeaders() }).then(r => r.json());
          const s = p.sentences.find(x => x.target === w && x.text !== text);
          if (s && sentEl) {
            S.personalized[w] = { text: s.text, recall: s.recall, zh: s.zh || "" }; save();
            sentEl.outerHTML = `<div class="sent"><span class="tag p">个性化</span>${s.text}<button class="plays" data-t="${s.text}">▶</button><button class="plays bad" data-t="${s.text}" data-w="${w}" data-kind="personal" title="换一句">↻</button>${s.zh ? `<div class="zh">${s.zh}</div>` : ""}</div>`;
            bindPlays();
          } else if (sentEl) sentEl.remove();
        }
      } catch (e) { if (sentEl) sentEl.remove(); }
    };
  });
}

/* ---- 复习卡：先 4 选 1 测试，再出答案卡 ---- */
const stageLabel = c => c.fsrs ? (isMastered(c) ? "已掌握" : `稳定≈${Math.round(c.fsrs.stability)}天`) : (c.stage === 6 ? "已掌握" : c.stage === 5 ? "长期池" : "D" + c.stage);

async function showReview(item) {
  const word = item.word;
  const c = S.cards[word];
  // 成熟卡（稳定度≥14 天）走反向回想（给中文选英文）；其余正向再认（与 App 一致）
  const mature = c.fsrs && c.fsrs.stability >= 14;
  let quiz = null;
  try { quiz = await fetch(`${API}/api/v1/quiz?pos=${c.pos}&seed=${Date.now() % 99991}&mode=${mature ? "reverse" : "forward"}`).then(r => r.json()); } catch (e) {}
  if (!quiz || !quiz.options || quiz.options.length < 4) return showReviewClassic(item);
  const isRev = quiz.mode === "reverse" && quiz.prompt;
  $("#app").innerHTML = `<div class="card center">
    <h2>复习 ${session.idx + 1}/${session.queue.length} · ${stageLabel(c)}</h2>
    ${isRev
      ? `<div><span class="big" style="font-size:30px">${quiz.prompt}</span></div><p class="muted" style="margin:10px 0 4px">回想它的英文单词：</p>`
      : `<div><span class="big">${word}</span><button class="playw" data-t="${word}">▶</button></div><p class="muted" style="margin:10px 0 4px">选出正确词义：</p>`}
    <div style="text-align:left">${quiz.options.map((o, i) => `<button class="opt" data-i="${i}">${o.text}</button>`).join("")}</div>
    <div class="progress"><i style="width:${session.idx / session.queue.length * 100}%"></i></div>
  </div>`;
  bindPlays();
  if (!isRev) playText(word);   // 反向回想不播单词（会泄题）
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const ok = quiz.options[+b.dataset.i].ok;
    document.querySelectorAll(".opt").forEach(x => {
      x.disabled = true;
      if (quiz.options[+x.dataset.i].ok) x.classList.add("right");
    });
    if (!ok) b.classList.add("wrong");
    setTimeout(() => answerCard(item, ok), 650);
  });
}

/* 答案卡：答错已记「忘记」，答对再选掌握程度 */
async function answerCard(item, quizOk, wrongRecorded = false) {
  const word = item.word;
  const c = S.cards[word];
  if (!quizOk && !wrongRecorded) { await review(word, 1); session.reviewedToday++; save(); }
  const d = await wordDetail(word, c.pos);
  let sents = d.sentences || [];
  if (!sents.length) { const t = await ensureSentence(word); if (t) sents = [{ tier: 1, text: t }]; }
  const personal = S.personalized[word];
  const sb = sentenceBlock(word, personal, sents);
  const answerSenses = d.senses.map(s => `<span><i>${s.pos || "·"}</i>${s.text}</span>`).join("")
    || `<span class="muted">词义加载失败，请检查网络</span><button class="ghost" id="bRetryDetail">重新加载</button>`;
  $("#app").innerHTML = `<div class="card">
    <h2>${quizOk ? "✓ 答对了——这次掌握程度？" : "✗ 正确答案"}</h2>
    <div><span class="big">${word}</span><button class="playw" data-t="${word}">▶</button></div>
    <div class="phon">${d.phonetic ? "/" + d.phonetic + "/" : ""}</div>
    <div class="sense">${answerSenses}</div>
    ${sb.html.replace('id="pendingSent"', "")}
    ${quizOk
      ? `<div class="row" style="margin-top:14px">
          <button class="act ghost" id="r2">困难</button>
          <button class="act ghost" id="r3">记得</button>
          <button class="act ok" id="r4">熟练</button>
        </div>`
      : `<div class="row" style="margin-top:14px"><button class="ghost" id="rUndo">撤销忘记</button><button class="act" id="rNext">继续 →</button></div>
         <p class="muted center" style="margin-top:8px">已记为「忘记」，降级并明天再见；误点可撤销重答</p>`}
  </div>`;
  bindPlays();
  if ($("#bRetryDetail")) $("#bRetryDetail").onclick = () => answerCard(item, quizOk, true);
  autoPlaySequence(word, sb.texts);
  let rated = false;
  const go = async r => {
    if (rated) return;
    rated = true;
    document.querySelectorAll("#r2,#r3,#r4").forEach(b => b.disabled = true);
    await review(word, r); session.reviewedToday++; session.idx++; save(); step();
  };
  if (quizOk) {
    $("#r2").onclick = () => go(2); $("#r3").onclick = () => go(3); $("#r4").onclick = () => go(4);
  } else {
    $("#rUndo").onclick = () => { undoReview(); showReview(item); };
    $("#rNext").onclick = () => { session.idx++; save(); step(); };
  }
}

/* 翻卡旧流程（出题失败时兜底） */
async function showReviewClassic(item) {
  const word = item.word;
  const c = S.cards[word];
  const d = await wordDetail(word, c.pos);
  $("#app").innerHTML = `<div class="card center">
    <h2>复习 ${session.idx + 1}/${session.queue.length} · ${stageLabel(c)}</h2>
    <div><span class="big">${word}</span><button class="playw" data-t="${word}">▶</button></div>
    <p class="muted" style="margin:12px 0">先回忆词义，再翻卡核对</p>
    <div class="row"><button class="act ghost" id="bFlip">显示释义</button></div>
    <div class="progress"><i style="width:${session.idx / session.queue.length * 100}%"></i></div>
  </div>`;
  bindPlays();
  $("#bFlip").onclick = () => answerCard(item, true);
}

/* 每日结算时清理已掌握词的个性化映射，防止毕业后继续展示 */
function prunePersonalized() {
  for (const w of Object.keys(S.personalized || {})) {
    if (S.cards[w] && isMastered(S.cards[w])) delete S.personalized[w];
  }
}

/* ---- 完成 + 自动触发个性化 ---- */
function doneDay() {
  prunePersonalized();
  if (S.lastDay !== today()) { S.streak = S.lastDay === addDays(today(), -1) ? S.streak + 1 : 1; S.lastDay = today(); }
  save(); renderChips();
  if (AUTH) pushState();   // 当日完成立即推服务器（不等防抖），手机端马上同步得到
  $("#app").innerHTML = `<div class="card center">
    <h2>今日完成 🎉</h2>
    <div class="stat-grid">
      <div class="stat"><b>${session.reviewedToday}</b><span>复习</span></div>
      <div class="stat"><b>${session.learnedToday}</b><span>新词</span></div>
      <div class="stat"><b>${S.streak}</b><span>连续天数</span></div>
    </div>
    ${S.calibrated && S.posterior ? `<p style="font-size:12px;color:#5f9cec;margin-top:8px">预计认识 ${expectedKnown()} 词（${LVL_NAME[(S.track && S.track.shownLevel) || lvlOfPos(S.frontier)]}），明天从 ${S.pointer} 附近发词</p><p class="muted" style="font-size:12px;margin-top:4px">今日水平证据：↑${S.log.filter(l => l.d === today() && ["learn", "review", "probe"].includes(l.kind) && l.rating >= 2).length} / ↓${S.log.filter(l => l.d === today() && ["learn", "review", "probe"].includes(l.kind) && l.rating === 1).length}（含 ${S.log.filter(l => l.d === today() && l.kind === "probe").length} 次水平探测）</p>${S.track && S.track.lastNote ? `<p class="muted" style="font-size:12px;margin-top:4px">${S.track.lastNote}</p>` : ""}` : ""}
    <div id="laterRow" style="margin-top:10px"></div>
    <div class="card" style="background:#12151a;margin-top:14px">
      <h2>今日薄弱词 · 个性化例句</h2>
      <div class="muted" id="genOut">正在为你的薄弱词定制例句…</div>
    </div>
  </div>`;
  // 日内步骤：FSRS learning steps 可能让词在当天稍后再到期
  const now = new Date(), eod = new Date(today() + "T23:59:59");
  const dueNowN = Object.values(S.cards).filter(c => !isMastered(c) && c.due && new Date(c.due) <= now).length;
  const laterN = Object.values(S.cards).filter(c => !isMastered(c) && c.due && new Date(c.due) > now && new Date(c.due) <= eod).length;
  if (dueNowN > 0) {
    $("#laterRow").innerHTML = `<div class="row"><button class="act ghost" id="bMore">还有 ${dueNowN} 词已到期，继续复习 →</button></div>`;
    $("#bMore").onclick = async () => { await buildQueue(); step(); };
  } else if (laterN > 0) {
    $("#laterRow").innerHTML = `<p class="muted">⏰ 今天晚些时候还有 ${laterN} 个词到期，记得回来</p>`;
  }
  autoPersonalize();
}

async function autoPersonalize() {
  const date = today();
  try {
    // 只为"今天觉得不熟练/没记住"的词定制（已掌握的词不再出现）
    const weakToday = [...new Set(S.log.filter(l => l.d === date && l.rating <= 2).map(l => l.word))]
      .filter(w => { const c = S.cards[w]; return !c || !isMastered(c); });
    // 去重：薄弱词集合没变化且今天已生成过 → 跳过
    const weakKey = [...weakToday].sort().join(",");
    if (S.personalizedDay === date && S.personalizedWeak === weakKey) {
      $("#genOut").textContent = "✓ 今天的薄弱词例句已就绪";
      return;
    }
    if (!weakToday.length) {
      $("#genOut").textContent = "今天没有薄弱词，全部掌握得很好 👍 无需定制";
      S.personalizedDay = date; S.personalizedWeak = ""; save(); return;
    }
    $("#genOut").textContent = `正在为今天的 ${weakToday.length} 个薄弱词定制复习例句…`;
    const body = {
      device: deviceId(), date,
      new_words: [], weak_words: weakToday.slice(0, 15),
      learned_max_pos: S.pointer + 10, sync: true
    };
    const r = await fetch(API + "/api/v1/personalize", {
      method: "POST", headers: { "Content-Type": "application/json", ...authHeaders() }, body: JSON.stringify({ ...body, replace: true })
    }).then(r => r.json());
    // 慢速模型异步生成：轮询取结果，等不到就明天复习时自动就绪
    let p = { sentences: [] };
    for (let k = 0; k < 10; k++) {
      await new Promise(res => setTimeout(res, 4000));
      p = await fetch(`${API}/api/v1/personalized?device=${deviceId()}&date=${date}`, { headers: authHeaders() }).then(r => r.json());
      if (p.sentences.length) break;
    }
    if (!p.sentences.length) {
      $("#genOut").textContent = `✓ 已提交生成任务（${weakToday.length} 个薄弱词），例句正在后台定制，明天复习时自动就绪`;
      S.personalizedDay = date; S.personalizedWeak = weakKey; save(); return;
    }
    p.sentences.forEach(s => S.personalized[s.target] = { text: s.text, recall: s.recall, zh: s.zh || "" });
    p.sentences.forEach(s => fetch(`${API}/api/v1/tts?text=${encodeURIComponent(s.text)}&v=${encodeURIComponent(S.settings.voice || "")}`).catch(() => {}));  // 音频预热
    S.personalizedDay = date;
    S.personalizedWeak = weakKey;
    save();
    $("#genOut").innerHTML = `✓ 已为今天 ${weakToday.length} 个薄弱词定制 ${p.sentences.length} 条复习例句（这些词明天复习时优先显示）：` +
      p.sentences.map(s => `<div class="sent" style="margin-top:6px"><span class="tag p">个性化</span>${s.text}<button class="plays" data-t="${s.text}">▶</button> <span class="zh">（复习词：${[s.target, ...(s.recall ? s.recall.split(",") : [])].join("、")}）</span>${s.zh ? `<div class="zh">${s.zh}</div>` : ""}</div>`).join("");
    bindPlays();
  } catch (e) {
    $("#genOut").textContent = "生成暂不可用，明天用静态例句（不影响学习）";
  }
}

function showStats() {
  stopAudio();
  const words = Object.entries(S.cards);
  const buckets = { "≥95%": 0, "90~95%": 0, "80~90%": 0, "60~80%": 0, "<60%": 0 };
  words.forEach(([w, c]) => {
    if (!c.fsrs || !c.fsrs.stability) return;
    const last = [...S.log].reverse().find(l => l.word === w);
    const t = last ? Math.max(0, (new Date(today()) - new Date(last.d)) / 86400000) : 0;
    const R = Math.pow(1 + 0.9805 * t / c.fsrs.stability, -0.1542);
    if (R >= 0.95) buckets["≥95%"]++; else if (R >= 0.9) buckets["90~95%"]++;
    else if (R >= 0.8) buckets["80~90%"]++; else if (R >= 0.6) buckets["60~80%"]++; else buckets["<60%"]++;
  });
  const day0 = today();
  const loads = Array.from({ length: 14 }, (_, i) => {
    const d = addDays(day0, i);
    return { d, n: Object.values(S.cards).filter(c => !isMastered(c) && c.due && c.due.slice(0, 10) === d).length };
  });
  loads[0].n += Object.values(S.cards).filter(c => !isMastered(c) && c.due && c.due.slice(0, 10) < day0).length;
  const maxL = Math.max(1, ...loads.map(x => x.n));
  const lapseCount = {};
  S.log.filter(l => l.rating <= 2).forEach(l => lapseCount[l.word] = (lapseCount[l.word] || 0) + 1);
  const stubborn = Object.entries(lapseCount).filter(([, n]) => n >= 2).sort((a, b) => b[1] - a[1]).slice(0, 8);
  $("#app").innerHTML = `<div class="card">
    <h2>学习统计</h2>
    <div class="stat-grid">
      <div class="stat"><b>${words.length}</b><span>已学</span></div>
      <div class="stat"><b>${words.filter(([, c]) => isMastered(c)).length}</b><span>已掌握</span></div>
      <div class="stat"><b>${S.streak}</b><span>连续天数</span></div>
    </div>
    <h2 style="margin-top:14px">记忆保持率分布（FSRS）</h2>
    ${Object.entries(buckets).map(([k, n]) => {
      const tot = Math.max(1, Object.values(buckets).reduce((a, b) => a + b, 0));
      return `<div class="row" style="margin-top:6px;align-items:center"><span class="muted" style="width:56px">${k}</span><div style="flex:1;height:10px;background:#12151a;border-radius:5px"><div style="width:${n / tot * 100}%;height:100%;background:#2f6fed;border-radius:5px"></div></div><span style="width:34px;text-align:right">${n}</span></div>`;
    }).join("")}
    <h2 style="margin-top:14px">未来 14 天负载预测</h2>
    <div class="row" style="align-items:flex-end;gap:3px;height:64px">
      ${loads.map(x => `<div style="flex:1;background:#2f6fed;border-radius:3px 3px 0 0;height:${Math.max(3, x.n / maxL * 60)}px" title="${x.d}: ${x.n}词"></div>`).join("")}
    </div>
    <div class="row" style="gap:3px">${loads.map((x, i) => `<div class="muted" style="flex:1;text-align:center;font-size:9px">${i % 2 ? "" : x.d.slice(5)}</div>`).join("")}</div>
    ${stubborn.length ? `<h2 style="margin-top:14px">顽固词（≥2 次没记住）</h2><p style="font-size:14px">${stubborn.map(([w, n]) => `${w} ×${n}`).join(" · ")}</p>` : ""}
    <div class="row"><button class="act ghost" id="bBack">返回</button></div>

  $("#bBack").onclick = home;
}

/* ---------------- 独立留出水平校验（不影响后验、卡片与学习计划） ---------------- */
let validation = null;
async function startValidation() {
  const r = await fetch(`${API}/api/v1/placement/set?seed=${encodeURIComponent("validation-" + deviceId() + "-" + Date.now())}`).then(r => r.json());
  const words = r.words.slice(0, 24).map((w, i) => ({ ...w, reverse: i % 2 === 1 }));
  validation = { words, idx: 0, posterior: null, correct: 0, failed: 0 };
  showValidation();
}

async function showValidation() {
  if (!validation) return;
  if (validation.idx >= validation.words.length) return finishValidation();
  const w = validation.words[validation.idx];
  let q = null;
  try { q = await fetch(`${API}/api/v1/quiz?pos=${w.pos}&seed=${Date.now() % 99991}&mode=${w.reverse ? "reverse" : "forward"}`).then(r => r.json()); } catch (e) {}
  if (!q || !q.options || q.options.length < 4) { validation.failed++; validation.idx++; return showValidation(); }
  const isRev = w.reverse && q.mode === "reverse" && q.prompt;
  $("#app").innerHTML = `<div class="card center">
    <h2>独立水平校验 ${validation.idx + 1}/${validation.words.length}</h2>
    <p class="muted">只用于检验估值偏差，不影响学习计划</p>
    ${isRev
      ? `<div><span class="big" style="font-size:30px">${q.prompt}</span></div><p class="muted">回想它的英文单词：</p>`
      : `<div><span class="big">${w.word}</span><button class="playw" data-t="${w.word}">▶</button></div><p class="muted">选出正确词义：</p>`}
    <div style="text-align:left">${q.options.map((o, i) => `<button class="opt" data-i="${i}">${o.text}</button>`).join("")}</div>
    <div class="progress"><i style="width:${validation.idx / validation.words.length * 100}%"></i></div>
  </div>`;
  bindPlays();
  if (!isRev) playText(w.word);
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const ok = q.options[+b.dataset.i].ok;
    document.querySelectorAll(".opt").forEach(x => {
      x.disabled = true;
      if (q.options[+x.dataset.i].ok) x.classList.add("right");
    });
    if (!ok) b.classList.add("wrong");
    validation.posterior = posteriorCalc(validation.posterior, w.pos, ok ? 1 : 0, 1.0, w.reverse ? 0 : 0.25);
    if (ok) validation.correct++;
    validation.idx++;
    setTimeout(showValidation, 450);
  });
}

function finishValidation() {
  if (validation.failed > 0 || !validation.posterior) {
    $("#app").innerHTML = `<div class="card center">
      <h2>校验暂不可用</h2>
      <p class="muted">部分题目加载失败，本次结果不作为估值依据。请重试。</p>
      <div class="row"><button class="act" id="bValRetry">重新校验</button><button class="ghost" id="bValBack">返回设置</button></div>
    </div>`;
    validation = null;
    $("#bValRetry").onclick = startValidation;
    $("#bValBack").onclick = showSettings;
    return;
  }
  const mean = Math.round(posteriorMean(validation.posterior));
  const std = Math.round(posteriorStd(validation.posterior));
  const appMean = Math.round(postMean());
  const delta = appMean - mean;
  S.evalReport = { date: today(), mean, std, appMean, delta, correct: validation.correct, count: validation.words.length };
  save();
  const direction = Math.abs(delta) <= 500 ? "与当前估值基本一致" : (delta > 0 ? "当前估值可能偏高" : "当前估值可能偏低");
  $("#app").innerHTML = `<div class="card center">
    <h2>独立校验结果</h2>
    <div class="score">${mean}</div>
    <p class="muted">独立估值（±${std}） · 答对 ${validation.correct}/${validation.words.length}</p>
    <p style="font-size:16px">当前学习系统估值：<b>${appMean}</b><br>差值（当前 − 独立）：<b>${delta > 0 ? "+" : ""}${delta}</b></p>
    <p class="muted">${direction}<br>这次校验没有修改你的后验、卡片或后续发词位置。</p>
    <div class="row"><button class="act" id="bValBack">返回设置</button><button class="ghost" id="bValAgain">重新校验</button></div>
  </div>`;
  validation = null;
  $("#bValBack").onclick = showSettings;
  $("#bValAgain").onclick = startValidation;
}

/* ---------------- 多用户：认证 / 同步 / 切换 ---------------- */
let AUTH = JSON.parse(localStorage.getItem("vocab_auth") || "null");
let syncFailed = false;   // 上次推送服务器失败（顶栏显示 ⚠️）
const IS_GUEST = () => !AUTH;

function authHeaders() { return AUTH ? { Authorization: `Bearer ${AUTH.token}` } : {}; }

function handleSyncError(e) {
  const m = String(e && e.message || e);
  if (/401|未登录|过期/.test(m)) {
    clearTimeout(save._t);
    AUTH = null;
    localStorage.removeItem("vocab_auth");
    renderUserTag();
    authForm("login");   // 凭证失效时引导重新登录，而不是反复同步失败
  } else {
    syncFailed = true;
    renderUserTag();
  }
}

async function pushState(expectedOwner = AUTH && AUTH.userId, snapshot = S) {
  if (!AUTH || AUTH.userId !== expectedOwner) return false;   // 切换账号后，旧推送作废
  try {
    await fetch(API + "/api/v1/me/state", { method: "PUT", headers: { "Content-Type": "application/json", ...authHeaders() }, body: JSON.stringify(snapshot) }).then(r => {
      if (!r.ok) throw new Error("HTTP " + r.status);   // 413 等非 200 也算失败
    });
    syncFailed = false; renderUserTag();
    localStorage.setItem("vocab_last_sync_ts", String(Date.now() / 1000));
    return true;
  } catch (e) { handleSyncError(e); return false; }
}
async function pullState(expectedOwner = AUTH && AUTH.userId) {
  if (!AUTH || AUTH.userId !== expectedOwner) return undefined;
  const r = await fetch(API + "/api/v1/me/state", { headers: authHeaders() });
  if (!r.ok) return undefined;
  const out = await r.json();   // {state, updated_at}——updated_at 用于"谁新听谁的"
  if (!AUTH || AUTH.userId !== expectedOwner) return undefined;   // 等待期间切号，旧响应作废
  return out;
}

/* 有未同步修改先补推，再拉服务器合并结果；没有未同步修改则以服务器为准。
   避免“本地时间新”被误当成“本地内容更新”而覆盖新服务器状态。 */
async function syncFromServer() {
  const localTs = +(localStorage.getItem("vocab_write_ts") || 0);
  const lastSync = +(localStorage.getItem("vocab_last_sync_ts") || 0);
  if (AUTH && localTs > lastSync + 0.5) {
    const pushed = await pushState();
    if (!pushed) return false;   // 推送失败保留本地，不拉服务器旧档覆盖
  }
  const remote = await pullState();
  if (remote && remote.state) {
    S = Object.assign(defaultState(), remote.state);
    localStorage.setItem("vocab_v1", JSON.stringify(S));
    return true;
  }
  return false;
}

function renderUserTag() {
  const el = document.querySelector("#userTag");
  if (el) el.textContent = (AUTH ? `· ${AUTH.nickname || AUTH.username}` : "· 游客（进度仅本机）") + (syncFailed ? " ⚠️同步失败" : "");
}

function archiveCurrent() {
  const key = AUTH ? `vocab_v1_u${AUTH.userId}` : "vocab_v1_guest";
  localStorage.setItem(key, JSON.stringify(S));
}
function loadSlot(key) {
  const raw = localStorage.getItem(key);
  if (raw) { S = JSON.parse(raw); return true; }
  return false;
}

function welcome() {
  renderUserTag();
  $("#app").innerHTML = `<div class="card center">
    <h2>欢迎使用 词航</h2>
    <p style="font-size:15px;margin:12px 0">登录后进度可跨设备同步；<br>游客模式进度仅保存在本机浏览器。</p>
    <div class="row"><button class="act" id="wLogin">登录</button></div>
    <div class="row"><button class="act ghost" id="wRegister">注册新账号</button></div>
    <div class="row"><button class="act ghost" id="wGuest">先逛逛（游客模式）</button></div>
  </div>`;
  $("#wLogin").onclick = () => authForm("login");
  $("#wRegister").onclick = () => authForm("register");
  $("#wGuest").onclick = () => { quizSet = []; localStorage.setItem("vocab_guest", "1"); loadSlot("vocab_v1_guest"); home(); };
}

function authForm(mode) {
  const isLogin = mode === "login";
  $("#app").innerHTML = `<div class="card">
    <h2>${isLogin ? "登录" : "注册"}</h2>
    <div class="row" style="flex-direction:column;align-items:stretch;gap:10px">
      <input type="text" id="aUser" placeholder="用户名（字母/数字/下划线，3~20 位）" style="width:100%">
      ${isLogin ? "" : `<input type="text" id="aNick" placeholder="昵称（可中文，仅展示用）" style="width:100%">`}
      <input type="password" id="aPass" placeholder="密码（至少 8 位）" style="width:100%">
      <button class="act" id="aGo">${isLogin ? "登录" : "注册并登录"}</button>
      <button class="act ghost" id="aBack">返回</button>
      <div class="muted" id="aMsg"></div>
    </div>
  </div>`;
  $("#aBack").onclick = welcome;
  $("#aGo").onclick = async () => {
    const username = $("#aUser").value.trim(), password = $("#aPass").value;
    const nickname = isLogin ? "" : $("#aNick").value.trim();
    $("#aMsg").textContent = "请稍候…";
    try {
      const r = await fetch(`${API}/api/v1/auth/${mode}`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password, nickname })
      });
      const d = await r.json();
      if (!r.ok) { $("#aMsg").textContent = "✗ " + (d.detail || "失败"); return; }
      await onAuthed(d, mode === "register");
    } catch (e) { $("#aMsg").textContent = "✗ 网络异常"; }
  };
}

async function onAuthed(d, isRegister) {
  clearTimeout(save._t);   // 取消旧账号延迟推送，防止旧状态写到新账号
  archiveCurrent();   // 先归档当前（游客或上一个账号）的进度
  quizSet = [];       // 换账号必须重抽定级题（否则新用户会做到上一个用户的卷子）
  AUTH = { userId: d.user.id, username: d.user.username, nickname: d.user.nickname, token: d.token };
  localStorage.setItem("vocab_auth", JSON.stringify(AUTH));
  localStorage.removeItem("vocab_guest");
  const owner = AUTH.userId, previousState = S;
  const slotKey = `vocab_v1_u${owner}`;
  const hasLocal = loadSlot(slotKey);
  S = Object.assign(defaultState(), hasLocal ? S : defaultState());
  localStorage.setItem("vocab_v1", JSON.stringify(S));
  const hasRemote = await syncFromServer();
  if (!AUTH || AUTH.userId !== owner) return;   // 凭证失效或等待期间切号，不覆盖后续页面
  if (!hasRemote) {
    if (hasLocal) {
      pushState();                      // 本机有这个账号的存档 → 推上服务器
    } else if (!isRegister && (Object.keys(previousState.cards || {}).length || previousState.probeCount > 0)) {
      S = Object.assign(defaultState(), previousState);
      localStorage.setItem("vocab_v1", JSON.stringify(S));
      pushState();                      // 老账号无存档时才并入之前的游客进度
    } else {
      S = defaultState();               // 注册新账号 = 全新开始（出定级），不并入任何现成进度
      localStorage.setItem("vocab_v1", JSON.stringify(S));
      pushState();
    }
  }
  renderUserTag();
  home();
}

async function userMenu() {
  if (!AUTH) {
    // 游客：归档游客进度后去欢迎页
    archiveCurrent();
    welcome();
    return;
  }
  $("#app").innerHTML = `<div class="card center">
    <h2>${AUTH.nickname || AUTH.username}</h2>
    <p class="muted">@${AUTH.username} · 进度已云端同步</p>
    <div class="row"><button class="act ghost" id="mSync">立即同步</button></div>
    <div class="row"><button class="act ghost" id="mSwitch">切换账号 / 游客模式</button></div>
    <div class="row"><button class="act warn" id="mLogout">退出登录</button></div>
    <div class="row"><button class="act ghost" id="mBack">返回学习</button></div>
    <div class="muted" id="mMsg"></div>
  </div>`;
  $("#mBack").onclick = home;
  $("#mSync").onclick = async () => { const ok = await pushState(); $("#mMsg").textContent = ok ? "✓ 已同步" : "同步失败，本地进度已保留，请稍后重试"; };
  $("#mSwitch").onclick = () => { clearTimeout(save._t); archiveCurrent(); quizSet = []; AUTH = null; localStorage.removeItem("vocab_auth"); renderUserTag(); welcome(); };
  $("#mLogout").onclick = async () => {
    await pushState();
    clearTimeout(save._t);
    try { await fetch(API + "/api/v1/auth/logout", { method: "POST", headers: authHeaders() }); } catch (e) {}
    archiveCurrent();
    AUTH = null;
    localStorage.removeItem("vocab_auth");
    if (!loadSlot("vocab_v1_guest")) {
      S = defaultState();
    }
    S = Object.assign(defaultState(), S);
    localStorage.setItem("vocab_v1", JSON.stringify(S));
    renderUserTag();
    welcome();
  };
}

$("#btnUser").onclick = userMenu;

function boot() {
  renderUserTag();
  if (AUTH) {
    syncFromServer().then(() => home()).catch(() => home());
  } else if (localStorage.getItem("vocab_guest")) {
    home();
  } else {
    welcome();
  }
}

$("#dateStr").textContent = today();
boot();
</script>
</body>
</html>
