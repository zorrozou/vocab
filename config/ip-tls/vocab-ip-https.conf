server {
    listen 443 ssl http2 default_server;
    server_name 175.27.210.206;
    ssl_certificate /home/ubuntu/vocab-certbot-production/config/live/175.27.210.206/fullchain.pem;
    ssl_certificate_key /home/ubuntu/vocab-certbot-production/config/live/175.27.210.206/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location /vocab/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 10m;
    }
    location / {
        proxy_pass http://127.0.0.1:80;
        proxy_set_header Host 175.27.210.206;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
